<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCEA Guidal – Suivi Récoltes</title>
<meta name="theme-color" content="#1E4736">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guidal Récoltes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
/* Charte SCEA Guidal — variante A « Terroir ». Pour changer de variante, ne modifier que ces deux blocs de couleurs. */
:root{
  --green:#1E4736; --green-ink:#1E4736; --red:#C61D2D; --ok:#2E7D32; --ok-mark:#50AF54;
  --bg:#F2EFE6; --surface:#FBFAF5; --surface-2:#E9E5D8; --line:#D9D3C2;
  --fg:#1F2A24; --muted:#5E6A61; --on-green:#F2EFE6; --ok-bg:#E3F1E1; --red-bg:#F8E1E2;
  --warn:#8A5A00; --warn-bg:#FBF0D9;
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Montserrat", "Segoe UI", system-ui, sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --green:#173A2B; --green-ink:#8CC9A0; --red:#E2535F; --ok:#7BCB80; --ok-mark:#6CC070;
  --bg:#121A16; --surface:#1A2520; --surface-2:#223029; --line:#2F3F36;
  --fg:#ECE8DD; --muted:#A3AFA6; --on-green:#F2EFE6; --ok-bg:#1F3524; --red-bg:#3A1C20;
  --warn:#F0C46A; --warn-bg:#3A3018; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.brand{background:var(--green);color:var(--on-green);padding-top:env(safe-area-inset-top,0px)}
header.brand .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.logo{width:48px;height:48px;flex:none}
.brand h1{font-family:var(--display);font-size:1.4rem;margin:0;line-height:1.1}
.brand .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;opacity:.8}
.userbox{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.85rem}
.userbox .role{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.btn-out{background:none;border:1px solid rgba(242,239,230,.45);color:var(--on-green);border-radius:8px;padding:7px 12px;font:600 .8rem var(--body);cursor:pointer}
.lang{display:inline-flex;border:1px solid rgba(242,239,230,.5);border-radius:99px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:var(--on-green);font:700 .75rem var(--body);padding:7px 11px;cursor:pointer;letter-spacing:.05em;min-height:34px}
.lang button[aria-pressed="true"]{background:var(--on-green);color:#1E4736}
nav.tabs{background:var(--green);border-top:1px solid rgba(255,255,255,.12)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:var(--on-green);opacity:.75;font:600 .9rem var(--body);padding:12px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
main{padding-block:20px calc(60px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--display);font-size:1.5rem;margin:0;color:var(--green-ink);text-wrap:balance}
h3{font-family:var(--display);font-size:1.15rem;margin:0 0 10px;color:var(--green-ink)}
p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input,select{font:500 1rem var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.btn{font:600 .95rem var(--body);border-radius:8px;padding:11px 18px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.validate{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--green-ink);padding-inline:6px}
.btn.danger{color:var(--red);border-color:var(--red);background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.85rem}
.btn.ico{padding:4px 9px;min-height:30px;font-size:.85rem}
.notice{padding:10px 14px;border-radius:8px;background:var(--surface-2);font-size:.9rem}
.notice.err{background:var(--red-bg)}
.notice.warn{background:var(--warn-bg);color:var(--fg)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.todo{background:var(--surface-2);color:var(--muted)}
.badge.off{background:var(--red-bg);color:var(--red)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.role{background:var(--surface-2);color:var(--green-ink)}
.demo-bar{background:#E0A526;color:#2a1f00;font-size:.8rem;font-weight:600;text-align:center;padding:6px 12px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.demo-bar button{font:600 .75rem var(--body);border:1px solid #2a1f00;background:none;border-radius:6px;padding:3px 9px;cursor:pointer;color:#2a1f00}
/* Connexion */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.login .top{background:var(--green);color:var(--on-green);padding:24px;text-align:center}
.login .top svg{width:84px;height:84px}
.login .top h1{font-family:var(--display);margin:8px 0 2px;font-size:1.6rem}
.login form,.login .demo{padding:22px;display:flex;flex-direction:column;gap:14px}
/* Saisie */
.people{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.person{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:60px;width:100%}
.person:last-child{border-bottom:0}
.person:hover{background:var(--surface-2)}
.person .nm{font-weight:600;flex:1;min-width:0}
.person .sum{font-size:.8rem;color:var(--muted);font-weight:500}
.sec{display:flex;align-items:center;gap:10px;margin-top:6px}
.sec h4{margin:0;font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--green-ink)}
.sec .ln{flex:1;height:1px;background:var(--line)}
.sec .chip{font-size:.72rem;font-weight:600;color:var(--muted)}
.grid-q{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.qrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.qrow.filled{border-color:var(--ok-mark);box-shadow:inset 3px 0 0 var(--ok-mark)}
.qrow .lg{font-weight:600}
.qrow .un{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--green-ink);font:700 1.4rem var(--body);cursor:pointer;line-height:1}
.stepper input{width:84px;text-align:center;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;padding-inline:4px}
.hours{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.hcard .hd{font-weight:700;margin-bottom:8px}
.hcard .tm{display:flex;align-items:center;gap:8px}
.hcard .tm input{font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.total{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--green);color:var(--on-green);border-radius:var(--r);padding:10px 16px;font-weight:600;flex-wrap:wrap}
.total strong{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.total .btn{background:none;color:var(--on-green);border-color:rgba(242,239,230,.45)}
.meter{font-size:.85rem;padding:10px 14px;border-radius:8px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.meter.over{background:var(--red-bg);color:var(--red)}
.meter.info{background:var(--surface-2);color:var(--muted)}
.actionbar{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;border-top:1px solid var(--line);margin-top:4px}
.actionbar .btn.validate{flex:1;font-size:1.05rem}
/* Supervision */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px;font:600 .88rem var(--body);color:var(--fg);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.periodnav{display:flex;align-items:center;gap:4px}
.periodnav strong{min-width:190px;text-align:center;text-transform:capitalize}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tile .v{font-family:var(--display);font-size:1.9rem;color:var(--green-ink);font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:.8rem;color:var(--muted)}
.tile.money{background:var(--green);border-color:var(--green)}
.tile.money .v,.tile.money .l{color:var(--on-green)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.grp{background:var(--surface-2);font-weight:700;color:var(--green-ink)}
tfoot td{font-weight:700;border-bottom:0;background:var(--surface-2)}
tr[data-sel-s]{cursor:pointer}
tr[data-sel-s]:hover td{background:var(--surface-2)}
tr.sel td,tr.sel:hover td{background:var(--ok-bg)}
.zero{color:var(--line)}
.eur{font-weight:700;color:var(--green-ink)}
details>summary{cursor:pointer;font-family:var(--display);font-size:1.15rem;color:var(--green-ink);margin-bottom:10px}
/* Paramètres */
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.listcfg{display:flex;flex-direction:column}
.listcfg .it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.listcfg .it:last-child{border-bottom:0}
.listcfg .it .nm{flex:1;min-width:140px;font-weight:600}
.listcfg .it.edit{align-items:flex-end}
.listcfg .it.edit input,.listcfg .it.edit select{flex:1;min-width:110px;width:auto;min-height:38px;padding:7px 10px}
td form.inl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end;white-space:normal;padding:4px 0}
td form.inl input,td form.inl select{min-height:38px;padding:7px 10px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,20,15,.55)}
dialog .dh{padding:16px 18px;background:var(--green);color:var(--on-green)}
dialog .dh h3{color:var(--on-green);margin:0}
dialog .db{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
/* Écran d'accueil « Lever du jour » (identique en mode clair et sombre) */
.splash{position:fixed;inset:0;z-index:100;background:#F2EFE6;color:#1E4736;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:env(safe-area-inset-top,0px) 16px calc(110px + env(safe-area-inset-bottom,0px))}
.splash .em{width:120px;height:120px;animation:sp-pop .9s ease-out both}
.splash .ttl{font-family:var(--display);font-size:2.2rem;font-weight:700;margin:16px 0 4px;letter-spacing:.01em}
.splash .tg{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#5E6A61}
.splash .dots{display:flex;gap:8px;margin-top:28px}
.splash .dots i{width:9px;height:9px;border-radius:50%;background:#C61D2D;animation:sp-blink 1.2s infinite}
.splash .dots i:nth-child(2){animation-delay:.2s}.splash .dots i:nth-child(3){animation-delay:.4s}
.splash .field{position:absolute;left:0;right:0;bottom:0;height:calc(100px + env(safe-area-inset-bottom,0px));background:#1E4736}
.splash .field svg{display:block;width:100%;height:100px}
.splash .ft{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:.72rem;letter-spacing:.08em;color:#F2EFE6;opacity:.85}
@keyframes sp-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sp-pop{0%{transform:translateY(14px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.splash .em,.splash .dots i{animation:none}}
.qrbox{background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center;align-self:center}
.qrbox svg{width:220px;height:220px;display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--green);color:var(--on-green);padding:12px 18px;border-radius:99px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.err{background:var(--red)}
@media (max-width:860px){.split{grid-template-columns:1fr}}
@media (max-width:640px){
  .userbox{margin-left:0;width:100%;justify-content:space-between}
  .periodnav strong{min-width:0;flex:1}
  .periodnav{width:100%}
  h2{font-size:1.3rem}
  .stepper button{width:42px;height:42px}
  .stepper input{width:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const I18N={
 fr:{saisie:"Saisie",saisieJour:"Saisie du jour",nSaisis:(d,n)=>`${d} / ${n} saisis`,date:"Date",search:"Rechercher un saisonnier",searchPh:"Nom ou prénom",

 pt:{saisie:"Registo",saisieJour:"Registo do dia",nSaisis:(d,n)=>`${d} / ${n} registados`,date:"Data",search:"Procurar trabalhador",searchPh:"Nome ou apelido",

};

/* ---------- utilitaires ---------- */
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
S.lang=load("guidal.lang")==="pt"?"pt":"fr";
const T=(k,...a)=>{const v=I18N[S.lang][k]??I18N.fr[k];return typeof v==="function"?v(...a):v};
const nf=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2});
const fmtN=n=>nf.format(n||0);
const ef=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const fmtE=n=>ef.format(n||0);
const fmtDay=(s,loc)=>new Intl.DateTimeFormat(loc||"fr-FR",{weekday:"short",day:"numeric",month:"short"}).format(parse(s));
const fmtLong=(s,loc)=>new Intl.DateTimeFormat(loc||"fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(parse(s));
const fmtDate=s=>s===PRIX_ORIGINE?"toujours":new Intl.DateTimeFormat("fr-FR").format(parse(s));
const isResp=()=>S.profil&&S.profil.role==="responsable";
function personName(id){const p=S.saisonniers.find(x=>x.id===String(id));return p?(p.nom.toUpperCase()+" "+p.prenom):"Saisonnier retiré"}
function sortedPeople(list){return list.slice().sort((a,b)=>(a.nom+" "+a.prenom).localeCompare(b.nom+" "+b.prenom,"fr"))}
const legById=id=>S.legumes.find(l=>l.id===String(id));
const activeLegumes=()=>S.legumes.filter(l=>l.actif);
const lname=l=>S.lang==="pt"&&l.nom_pt?l.nom_pt:l.nom;
/* unités : « 3 colis », « 1 unité », « 120 unités », « 2,5 h » */
function unitShort(mode,n,lang){
  if(mode==="heure")return "h";
  if(lang==="pt")return mode==="colis"?(Math.abs(n)<2?"caixa":"caixas"):(Math.abs(n)<2?"unidade":"unidades");
  return mode==="colis"?"colis":(Math.abs(n)<2?"unité":"unités");
}
/* horaires : « 07:30 » ; durées en heures décimales ; affichage « 8 h 30 » */
const fmtT=s=>s?String(s).slice(0,5):"";
function tmin(s){if(!s)return null;const [h,m]=String(s).slice(0,5).split(":").map(Number);return h*60+m}
function span(a,b){const x=tmin(a),y=tmin(b);return x!=null&&y!=null&&y>x?(y-x)/60:0}
const presH=h=>h?span(h.md,h.mf)+span(h.ad,h.af):0;
function fmtH(h){const t=Math.round((h||0)*60);return Math.floor(t/60)+" h "+pad(t%60)}
const halfDay=(a,b)=>a&&b?fmtT(a)+"–"+fmtT(b):"—";
const parName=id=>{if(!id)return "—";const p=S.profils.find(x=>x.id===id);return p?p.nom:"Ancien compte"};
const roleLabel=r=>r==="responsable"?"Responsable":"Chef d'équipe";
function toast(msg,err){const t=document.getElementById("toast");t.textContent=msg;t.className="toast"+(err?" err":"");t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3600)}
function errMsg(e){
  const m=(e&&(e.message||e.error_description))||String(e||"");
  if(/row-level security|permission denied|violates row-level/i.test(m))return "Action refusée : vous n'avez pas les droits, ou la date est hors de la période autorisée.";
  if(/Failed to fetch|NetworkError|network/i.test(m))return "Pas de connexion internet. Réessayez dans un instant.";
  if(/changer_identifiant/i.test(m))return "La base doit être mise à jour : exécutez le fichier supabase/maj-01-identifiant.sql dans Supabase (voir le guide).";
  if(/enregistrer_journee|presences|tarifs|smic|nom_pt|column .*mode/i.test(m))return "La base doit être mise à jour : exécutez le fichier supabase/maj-02-paie.sql dans Supabase (voir le guide).";
  if(/Réservé|caractères|Identifiant invalide|existe déjà|introuvable/.test(m))return m;
  return "Erreur : "+m;
}

/* ---------- tarifs ---------- */
function priceAt(lid,date){let b=null;for(const t of S.tarifs)if(t.lid===String(lid)&&t.depuis<=date&&(!b||t.depuis>b.depuis))b=t;return b?b.prix:null}
function smicAt(date){let b=null;for(const t of S.smic)if(t.depuis<=date&&(!b||t.depuis>b.depuis))b=t;return b?b.taux:null}
const tarifsOf=lid=>S.tarifs.filter(t=>t.lid===String(lid)).sort((a,b)=>b.depuis.localeCompare(a.depuis));
/* montant d'une journée */
function value(e){
  const v={tache:0,heure:0,total:0,colis:0,unites:0,hh:0,pres:presH(e.h),smicMin:0,missing:false};
  for(const [k,q] of Object.entries(e.q)){
    if(!(q>0))continue;const l=legById(k);if(!l)continue;
    const p=priceAt(k,e.date);if(p==null)v.missing=true;const m=(p||0)*q;
    if(l.mode==="heure"){v.hh+=q;v.heure+=m}else{v.tache+=m;if(l.mode==="colis")v.colis+=q;else v.unites+=q}
  }
  v.total=v.tache+v.heure;const sm=smicAt(e.date);if(sm)v.smicMin=v.pres*sm;
  return v;
}

/* ---------- périodes ---------- */
function periodRange(){
  const a=S.anchor;
  if(S.period==="jour")return [a,a];
  if(S.period==="semaine"){const d=parse(a);const dow=(d.getDay()+6)%7;const start=addDays(a,-dow);return [start,addDays(start,6)]}
  return monthRange(a);
}
function monthRange(a){const d=parse(a);return [iso(new Date(d.getFullYear(),d.getMonth(),1)),iso(new Date(d.getFullYear(),d.getMonth()+1,0))]}
const monthLabel=a=>new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric"}).format(parse(a));
function periodLabel(){
  const [a,b]=periodRange();
  if(S.period==="jour")return fmtLong(a);
  if(S.period==="mois")return monthLabel(a);
  return "Semaine du "+fmtDay(a)+" au "+fmtDay(b);
}
function shiftPeriod(dir){
  if(S.period==="jour")S.anchor=addDays(S.anchor,dir);
  else if(S.period==="semaine")S.anchor=addDays(S.anchor,7*dir);
  else{const d=parse(S.anchor);S.anchor=iso(new Date(d.getFullYear(),d.getMonth()+dir,1))}
  loadRange();
}

/* ---------- données ---------- */
async function fetchAll(table,cols,a,b){
  const out=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from(table).select(cols).gte("date",a).lte("date",b).order("id").range(from,from+999);
    if(error)throw error;
    out.push(...data);
    if(data.length<1000)break;
  }
  return out;
}
async function fetchDays(a,b){
  const [r,p]=await Promise.all([
    fetchAll("recoltes","date,saisonnier_id,legume_id,quantite,saisi_par,corrige_par",a,b),
    fetchAll("presences","date,saisonnier_id,matin_debut,matin_fin,am_debut,am_fin,saisi_par,corrige_par",a,b)]);
  const m={};
  const get=(d,s,par)=>{const k=d+"|"+s;return m[k]||(m[k]={date:d,sid:String(s),q:{},h:null,par,corr:null})};
  for(const x of r){const e=get(x.date,x.saisonnier_id,x.saisi_par);e.q[String(x.legume_id)]=Number(x.quantite);if(x.corrige_par)e.corr=x.corrige_par}
  for(const x of p){const e=get(x.date,x.saisonnier_id,x.saisi_par);e.h={md:fmtT(x.matin_debut),mf:fmtT(x.matin_fin),ad:fmtT(x.am_debut),af:fmtT(x.am_fin)};if(x.corrige_par)e.corr=x.corrige_par}
  return Object.values(m).sort((x,y)=>x.date.localeCompare(y.date)||personName(x.sid).localeCompare(personName(y.sid),"fr"));
}
async function loadRef(){
  const [s,l]=await Promise.all([
    sb.from("saisonniers").select("id,nom,prenom,actif"),
    sb.from("legumes").select("id,nom,nom_pt,mode,actif,ordre").order("ordre").order("id")]);
  if(s.error)throw s.error; if(l.error)throw l.error;
  S.saisonniers=s.data.map(x=>({...x,id:String(x.id)}));
  S.legumes=l.data.map(x=>({...x,id:String(x.id)})).sort((a,b)=>MODES.indexOf(a.mode)-MODES.indexOf(b.mode)||(a.ordre-b.ordre)||(a.id-b.id));
  if(isResp()){
    const [t,m]=await Promise.all([sb.from("tarifs").select("id,legume_id,prix,depuis"),sb.from("smic").select("depuis,taux")]);
    if(t.error)throw t.error; if(m.error)throw m.error;
    S.tarifs=t.data.map(x=>({id:x.id,lid:String(x.legume_id),prix:Number(x.prix),depuis:x.depuis}));
    S.smic=m.data.map(x=>({depuis:x.depuis,taux:Number(x.taux)}));
  }
}
async function loadDay(){
  const t=++dayToken;
  try{const ents=await fetchDays(S.date,S.date);if(t!==dayToken)return;
    const m={};for(const e of ents)m[e.sid]=e;S.day=m;}
  catch(e){if(t===dayToken){S.day={};toast(errMsg(e),true)}}
  render();
}
async function loadRange(){
  if(!isResp())return;
  const t=++rangeToken;S.range=null;render();
  const [a,b]=periodRange();
  try{const ents=await fetchDays(a,b);if(t!==rangeToken)return;S.range=ents}
  catch(e){if(t===rangeToken){S.range=[];toast(errMsg(e),true)}}
  render();
}
async function loadMois(){
  if(!isResp())return;
  const t=++moisToken;const [a,b]=monthRange(today());
  try{const ents=await fetchDays(a,b);if(t!==moisToken)return;S.mois=ents}
  catch(e){if(t===moisToken){S.mois=[];toast(errMsg(e),true)}}
  render();
}
async function loadProfils(){
  if(!isResp())return;
  const [p,i]=await Promise.all([sb.from("profils").select("*").order("nom"),sb.from("invitations").select("*").order("nom")]);
  if(!p.error)S.profils=p.data; if(!i.error)S.invitations=i.data;
}
function scheduleReload(what){
  clearTimeout(reloadT);
  reloadT=setTimeout(async()=>{
    try{if(what==="ref")await loadRef();}catch(e){}
    loadDay();loadRange();loadMois();
  },400);
}
function subscribe(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel("guidal-live");
  for(const t of ["recoltes","presences"])chan.on("postgres_changes",{event:"*",schema:"public",table:t},()=>scheduleReload("rec"));
  for(const t of ["saisonniers","legumes","tarifs","smic"])chan.on("postgres_changes",{event:"*",schema:"public",table:t},()=>scheduleReload("ref"));
  chan.subscribe();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.profil&&S.profil.actif)scheduleReload("ref")});

/* ---------- session ---------- */
async function onSession(session){
  const prev=S.session&&S.session.user.id;
  S.session=session;
  if(session&&prev===session.user.id&&S.profil)return;
  if(chan){sb.removeChannel(chan);chan=null}
  S.profil=null;S.day=null;S.range=null;S.mois=null;S.profils=[];S.selected=null;S.editCfg=null;S.tarifs=[];S.smic=[];S.selS=null;
  if(!session){await splashWait();S.booting=false;render();tryStoredCredential();return}
  S.booting=true;render();
  const {data,error}=await sb.from("profils").select("*").eq("id",session.user.id).maybeSingle();
  if(error||!data||!data.actif){await splashWait();S.profil={blocked:true,actif:false,nom:data?data.nom:""};S.booting=false;render();return}
  S.profil=data;
  const v=load("guidal.view");S.view=(isResp()&&["saisie","supervision","saisonniers","produits","equipe"].includes(v))?v:"saisie";
  try{await loadRef();await loadProfils()}catch(e){toast(errMsg(e),true)}
  await splashWait();
  S.booting=false;
  loadDay();loadRange();loadMois();subscribe();render();
}
/* Biométrie : le téléphone propose le mot de passe enregistré après Face ID / empreinte (Android : Credential Management ; iPhone : trousseau iCloud via le remplissage automatique) */
let credTried=false;
async function tryStoredCredential(){
  if(DEMO||credTried||!window.PasswordCredential||!navigator.credentials)return;
  credTried=true;
  try{const c=await navigator.credentials.get({password:true,mediation:"optional"});
    if(c&&c.password&&!S.session){S.form["l-ident"]=c.id;login(c.id,c.password)}}catch(e){}
}
async function login(ident,mdp){
  ident=ident.trim().toLowerCase();
  if(!ident||!mdp){S.loginErr="Saisissez votre identifiant et votre mot de passe.";render();return}
  S.loginBusy=true;S.loginErr="";render();
  const email=ident.includes("@")?ident:ident+"@"+DOMAIN;
  const {error}=await sb.auth.signInWithPassword({email,password:mdp});
  S.loginBusy=false;
  if(!error&&!DEMO&&window.PasswordCredential&&navigator.credentials){try{await navigator.credentials.store(new PasswordCredential({id:ident,password:mdp,name:ident}))}catch(e){}}
  if(error){
    S.loginErr=/Invalid login/i.test(error.message)?"Identifiant ou mot de passe incorrect.":
      /not confirmed/i.test(error.message)?"Compte pas encore confirmé. Le responsable doit désactiver « Confirm email » dans Supabase (voir le guide).":errMsg(error);
    render();
  }
}

/* --- Saisie --- */
function summary(e,lang){
  const parts=[];if(e.h&&presH(e.h))parts.push(fmtH(presH(e.h)));
  for(const l of S.legumes){const q=Number(e.q[l.id]);if(q>0){const nm=(lang==="pt"&&l.nom_pt?l.nom_pt:l.nom).toLowerCase();parts.push(fmtN(q)+" "+unitShort(l.mode,q,lang)+" "+nm)}}
  return parts.join(" · ");
}
function meterHtml(){
  const pres=presH(S.hdraft);let hh=0;
  for(const l of activeLegumes())if(l.mode==="heure")hh+=Number(S.draft[l.id])||0;
  if(!pres)return `<div class="meter info">${T("mInfo")}</div>`;
  if(hh>pres+1e-9)return `<div class="meter over">${T("mOver",fmtH(hh),fmtH(pres))}</div>`;
  return `<div class="meter">${T("mOk",fmtH(hh),fmtH(pres-hh),fmtH(pres))}</div>`;
}
function updMeter(){
  const m=document.getElementById("meter");if(m)m.innerHTML=meterHtml();
  const p=document.getElementById("pres-tot");if(p)p.textContent=fmtH(presH(S.hdraft));
  document.querySelectorAll("[data-q]").forEach(i=>{const r=i.closest(".qrow");if(r)r.classList.toggle("filled",Number(i.value)>0)});
}
const timeInput=(k,label)=>`<input type="time" id="h-${k}" data-h="${k}" step="300" value="${esc(S.hdraft[k]||"")}" aria-label="${esc(label)}">`;
function viewSaisie(){
  const legs=activeLegumes();const entries=S.day||{};const loc=T("locale");
  const minDate=isResp()?"":addDays(today(),-CHEF_JOURS);
  if(S.selected){
    const p=S.saisonniers.find(x=>x.id===S.selected);
    const secs=MODES.map(mode=>{

}

/* --- Supervision et paie --- */
const ZERO=()=>({tache:0,heure:0,total:0,colis:0,unites:0,hh:0,pres:0,smicMin:0});
function aggregate(list){
  const ents=(list||[]).filter(e=>presH(e.h)>0||Object.values(e.q).some(v=>v>0));
  const by={};const tot=ZERO();const qtot={};let missing=false;
  for(const e of ents){
    const v=value(e);e.v=v;if(v.missing)missing=true;
    const r=by[e.sid]||(by[e.sid]={sid:e.sid,days:new Set(),q:{},...ZERO()});
    r.days.add(e.date);
    for(const k in tot){r[k]+=v[k];tot[k]+=v[k]}
    for(const [k,q] of Object.entries(e.q)){r.q[k]=(r.q[k]||0)+q;qtot[k]=(qtot[k]||0)+q}
  }
  const rows=Object.values(by).sort((a,b)=>personName(a.sid).localeCompare(personName(b.sid),"fr"));
  for(const r of rows)r.alert=r.smicMin>0&&r.total+0.005<r.smicMin;
  return {ents,rows,tot,qtot,missing,legs:S.legumes.filter(l=>l.actif||qtot[l.id]>0)};
}
function viewSupervision(){
  const per=["jour","semaine","mois"].map(p=>`<button data-period="${p}" aria-pressed="${S.period===p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join("");
  const has=S.range&&S.range.length;
  const head=`<div class="row between"><h2>Tableau de bord</h2>
      <div class="row"><button class="btn primary" data-act="xlsx" ${has?"":"disabled"}>Exporter vers Excel</button><button class="btn" data-act="csv" ${has?"":"disabled"}>CSV</button></div></div>
    <div class="row"><div class="seg" role="group" aria-label="Période">${per}</div>
      <div class="periodnav"><button class="btn sm" data-act="prev" aria-label="Période précédente">‹</button>
      <strong>${esc(periodLabel())}</strong>
      <button class="btn sm" data-act="next" aria-label="Période suivante">›</button>
      <button class="btn sm ghost" data-act="now">Aujourd'hui</button></div></div>`;
  if(!S.range)return `<div class="stack">${head}<p class="muted">Chargement de la période…</p></div>`;
  const A=aggregate(S.range);
  if(!A.ents.length)return `<div class="stack">${head}<div class="panel"><h3>Aucune saisie sur cette période</h3><p class="muted">Les saisies des chefs d'équipe apparaissent ici en temps réel.</p></div></div>`;
  const notes=[];
  if(A.missing)notes.push(`<div class="notice warn">Certains produits saisis n'ont pas de prix sur cette période : les montants sont incomplets. <button class="btn sm ghost" data-view="produits">Compléter les tarifs →</button></div>`);
  if(!S.smic.length)notes.push(`<div class="notice">Renseignez le SMIC horaire dans « Produits et tarifs » pour activer l'alerte SMIC.</div>`);
  const alerts=A.rows.filter(r=>r.alert).length;
  const tiles=`<div class="tile"><div class="v">${fmtN(A.tot.pres)}</div><div class="l">heures de présence</div></div>
    <div class="tile"><div class="v">${fmtN(A.tot.colis)}</div><div class="l">colis</div></div>
    ${A.tot.unites?`<div class="tile"><div class="v">${fmtN(A.tot.unites)}</div><div class="l">unités</div></div>`:""}
    <div class="tile"><div class="v">${fmtN(A.tot.hh)}</div><div class="l">heures à l'heure</div></div>
    <div class="tile"><div class="v">${A.rows.length}</div><div class="l">saisonniers</div></div>
    <div class="tile money"><div class="v">${fmtE(A.tot.total)}</div><div class="l">montant total${alerts?` · ${alerts} sous le SMIC`:""}</div></div>`;
  const det=A.ents.slice().reverse().map(e=>{const h=e.h||{};return `<tr><td>${esc(fmtDay(e.date))}</td><td>${esc(personName(e.sid))}</td>
    <td>${halfDay(h.md,h.mf)}</td><td>${halfDay(h.ad,h.af)}</td><td class="n">${e.v.pres?fmtH(e.v.pres):"—"}</td>
    <td style="white-space:normal;min-width:200px">${esc(summary({q:e.q,h:null},"fr"))||`<span class="muted">—</span>`}</td>
    <td class="n eur">${fmtE(e.v.total)}${e.v.missing?` <span class="badge warn" title="Prix manquant">?</span>`:""}</td>
    <td>${esc(parName(e.par))}${e.corr?` <span class="muted">· corrigé par ${esc(parName(e.corr))}</span>`:""}</td>
    <td><button class="btn sm" data-edit="${e.date}|${e.sid}">Corriger</button></td></tr>`}).join("");
  const paie=A.rows.map(r=>`<tr><td>${esc(personName(r.sid))}</td><td class="n">${r.days.size}</td><td class="n">${fmtN(r.pres)}</td>
    <td class="n ${r.colis?"":"zero"}">${fmtN(r.colis)}</td><td class="n ${r.unites?"":"zero"}">${fmtN(r.unites)}</td><td class="n ${r.hh?"":"zero"}">${fmtN(r.hh)}</td>
    <td class="n">${fmtE(r.tache)}</td><td class="n">${fmtE(r.heure)}</td><td class="n eur">${fmtE(r.total)}</td>
    <td>${r.alert?`<span class="badge warn" title="Minimum SMIC : ${fmtE(r.smicMin)} pour ${fmtN(r.pres)} h de présence">⚠ sous le SMIC (${fmtE(r.smicMin)})</span>`:""}</td></tr>`).join("");
  const T0=A.tot;
  const foot=`<tr><td>Total</td><td></td><td class="n">${fmtN(T0.pres)}</td><td class="n">${fmtN(T0.colis)}</td><td class="n">${fmtN(T0.unites)}</td><td class="n">${fmtN(T0.hh)}</td><td class="n">${fmtE(T0.tache)}</td><td class="n">${fmtE(T0.heure)}</td><td class="n">${fmtE(T0.total)}</td><td></td></tr>`;
  const th=A.legs.map(l=>`<th class="n">${esc(l.nom)} <span style="text-transform:none">(${MODE_UNIT[l.mode]==="heure"?"h":esc(MODE_UNIT[l.mode])})</span></th>`).join("");
  const qrows=A.rows.map(r=>`<tr><td>${esc(personName(r.sid))}</td>${A.legs.map(l=>`<td class="n ${r.q[l.id]?"":"zero"}">${fmtN(r.q[l.id])}</td>`).join("")}</tr>`).join("");
  const qfoot=`<tr><td>Total</td>${A.legs.map(l=>`<td class="n">${fmtN(A.qtot[l.id])}</td>`).join("")}</tr>`;
  return `<div class="stack">${head}
    ${notes.join("")}
    <div class="tiles">${tiles}</div>
    <div><h3>Saisies journalières</h3><div class="tscroll"><table><thead><tr><th>Date</th><th>Saisonnier</th><th>Matin</th><th>Après-midi</th><th class="n">Présence</th><th>Réalisé</th><th class="n">Montant</th><th>Saisi par</th><th></th></tr></thead><tbody>${det}</tbody></table></div></div>
    <div><h3>Paie par saisonnier</h3><div class="tscroll"><table><thead><tr><th>Saisonnier</th><th class="n">Jours</th><th class="n">Présence (h)</th><th class="n">Colis</th><th class="n">Unités</th><th class="n">Heures à l'heure</th><th class="n">À la tâche</th><th class="n">À l'heure</th><th class="n">Total</th><th></th></tr></thead><tbody>${paie}</tbody><tfoot>${foot}</tfoot></table></div></div>
    <details><summary>Quantités par produit</summary><div class="tscroll"><table><thead><tr><th>Saisonnier</th>${th}</tr></thead><tbody>${qrows}</tbody><tfoot>${qfoot}</tfoot></table></div></details>
  </div>`;
}

/* --- Produits et tarifs --- */
function priceCell(l){
  const p=priceAt(l.id,today());const fut=tarifsOf(l.id).find(t=>t.depuis>today());
  const u=l.mode==="heure"?"h":MODE_UNIT[l.mode];
  return (p==null?`<span class="badge warn">Prix à définir</span>`:`<span class="eur">${fmtE(p)}</span> <span class="muted">/ ${u}</span>`)
    +(fut?`<div class="muted" style="font-size:.75rem">${fmtE(fut.prix)} à partir du ${fmtDate(fut.depuis)}</div>`:"");
}

  d.querySelector("#form-edit").onsubmit=async ev=>{

    d.querySelectorAll("[data-eh]").forEach(i=>{hh[i.dataset.eh]=i.value});

    if(error)return toast(errMsg(error),true);
    d.close();toast("Saisie corrigée");loadDay();loadRange();loadMois();
  };
}
/* contrôle des horaires (renvoie un message d'erreur ou rien) */
function checkHours(h,q,lang){
  const t=k=>I18N[lang][k];
  for(const [a,b] of [["md","mf"],["ad","af"]]){if(!!h[a]!==!!h[b])return t("errPair");if(h[a]&&tmin(h[b])<=tmin(h[a]))return t("errOrder")}
  let hh=0;for(const [k,v] of Object.entries(q)){const l=legById(k);if(l&&l.mode==="heure")hh+=v}
  const pres=presH(h);
  if(pres&&hh>pres+1e-9)return t("errOver");
  return "";
}
const horairesDb=h=>({matin_debut:h.md||null,matin_fin:h.mf||null,am_debut:h.ad||null,am_fin:h.af||null});

/* ---------- export ---------- */
const r2=n=>Math.round((n||0)*100)/100;
function exportRows(){
  const A=aggregate(S.range);const [a,b]=periodRange();
  const who=sid=>S.saisonniers.find(x=>x.id===sid)||{nom:"Saisonnier retiré",prenom:""};
  const paie=[["Nom","Prénom","Jours travaillés","Heures de présence","Colis","Unités","Heures à l'heure","Montant à la tâche (€)","Montant à l'heure (€)","Total (€)","Minimum SMIC (€)","Alerte"]];
  for(const r of A.rows){const p=who(r.sid);paie.push([p.nom.toUpperCase(),p.prenom,r.days.size,r2(r.pres),r.colis,r.unites,r2(r.hh),r2(r.tache),r2(r.heure),r2(r.total),r2(r.smicMin),r.alert?"Sous le SMIC":""])}
  paie.push(["TOTAL","","",r2(A.tot.pres),A.tot.colis,A.tot.unites,r2(A.tot.hh),r2(A.tot.tache),r2(A.tot.heure),r2(A.tot.total),r2(A.tot.smicMin),""]);
  const detail=[["Date","Nom","Prénom","Matin début","Matin fin","Après-midi début","Après-midi fin","Présence (h)","Produit","Mode de paie","Quantité","Prix unitaire (€)","Montant (€)","Saisi par","Corrigé par"]];
  for(const e of A.ents){const p=who(e.sid);const h=e.h||{};
    const base=[e.date,p.nom.toUpperCase(),p.prenom,h.md||"",h.mf||"",h.ad||"",h.af||"",r2(e.v.pres)];
    const end=[parName(e.par),e.corr?parName(e.corr):""];
    const ls=S.legumes.filter(l=>Number(e.q[l.id])>0);
    if(!ls.length)detail.push([...base,"","","","","",...end]);
    ls.forEach((l,i)=>{const q=Number(e.q[l.id]);const pr=priceAt(l.id,e.date);
      detail.push([...(i?[e.date,p.nom.toUpperCase(),p.prenom,"","","","",""]:base),l.nom,MODE_LABEL[l.mode],q,pr==null?"":pr,pr==null?"":r2(pr*q),...end])});
  }
  const tarifs=[["Produit","Portugais","Mode de paie","Prix (€)","À partir du"]];
  for(const l of S.legumes)for(const t of tarifsOf(l.id).slice().reverse())tarifs.push([l.nom,l.nom_pt||"",MODE_LABEL[l.mode],t.prix,t.depuis===PRIX_ORIGINE?"":t.depuis]);
  tarifs.push([]);tarifs.push(["SMIC horaire brut","","",""," "]);
  for(const s of S.smic.slice().sort((x,y)=>x.depuis.localeCompare(y.depuis)))tarifs.push(["SMIC","","",s.taux,s.depuis]);
  return {paie,detail,tarifs,tag:S.period==="mois"?a.slice(0,7):a+"_"+b,a,b};
}
function saveBlob(name,blob){
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast("Fichier téléchargé : "+name);
}
function doXlsx(){
  if(!window.XLSX)return toast("Module Excel non chargé. Utilisez l'export CSV.",true);
  const R=exportRows();const wb=XLSX.utils.book_new();
  const head=[["SCEA Guidal · Paie des saisonniers"],["Période : "+periodLabel()+" ("+R.a+" au "+R.b+")"],[]];
  const ws1=XLSX.utils.aoa_to_sheet(head.concat(R.paie));
  ws1["!cols"]=[{wch:20},{wch:16},...R.paie[0].slice(2).map(()=>({wch:17}))];
  XLSX.utils.book_append_sheet(wb,ws1,"Paie");
  const ws2=XLSX.utils.aoa_to_sheet(R.detail);ws2["!cols"]=[{wch:12},{wch:18},{wch:14},{wch:11},{wch:11},{wch:11},{wch:11},{wch:11},{wch:18},{wch:12},{wch:10},{wch:12},{wch:12},{wch:18},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws2,"Détail");
  const ws3=XLSX.utils.aoa_to_sheet(R.tarifs);ws3["!cols"]=[{wch:20},{wch:18},{wch:14},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws3,"Tarifs");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  saveBlob("Paie_SCEA-Guidal_"+R.tag+".xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}
function doCsv(){
  const R=exportRows();
  const csv=R.paie.map(r=>r.map(v=>{const s=typeof v==="number"?String(v).replace(".",","):String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(";")).join("\r\n");
  saveBlob("Paie_SCEA-Guidal_"+R.tag+".csv",new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
}

/* ---------- actions ---------- */
async function run(p,okMsg){const {error}=await p;if(error){toast(errMsg(error),true);return false}if(okMsg)toast(okMsg);return true}
async function createAccount(){
  const nom=(S.form["u-nom"]||"").trim(),ident=(S.form["u-ident"]||"").trim().toLowerCase(),mdp=S.form["u-mdp"]||"",role=S.form["u-role"]||"chef";
  if(!nom||!ident||!mdp)return toast("Remplissez le nom, l'identifiant et le mot de passe.",true);
  if(!/^[a-z0-9._-]{2,40}$/.test(ident))return toast("Identifiant invalide : lettres minuscules sans accent, chiffres, point ou tiret.",true);
  if(mdp.length<6)return toast("Le mot de passe doit faire au moins 6 caractères.",true);
  if(S.profils.some(p=>p.identifiant===ident))return toast("Cet identifiant existe déjà.",true);
  S.form._busy=true;render();
  try{
    if(DEMO){const r=await sb.from("profils").insert({identifiant:ident,nom,role});if(r.error)throw r.error}
    else{
      let r=await sb.from("invitations").upsert({identifiant:ident,nom,role});
      if(r.error)throw r.error;
      const tmp=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"guidal-creation"}});
      r=await tmp.auth.signUp({email:ident+"@"+DOMAIN,password:mdp});
      if(r.error){await sb.from("invitations").delete().eq("identifiant",ident);throw r.error}
    }
    await loadProfils();
    if(S.profils.some(p=>p.identifiant===ident)){S.form["u-nom"]=S.form["u-ident"]=S.form["u-mdp"]="";toast("Compte créé : "+ident)}
    else toast("Compte enregistré mais pas encore actif. Vérifiez le réglage « Confirm email » dans Supabase (voir le guide).",true);
  }catch(e){toast(/already registered/i.test(e.message||"")?"Cet identifiant existe déjà.":errMsg(e),true)}
  S.form._busy=false;render();
}
async function moveLegume(id,dir){
  const l=legById(id);if(!l)return;
  const grp=S.legumes.filter(x=>x.mode===l.mode);const i=grp.indexOf(l),j=i+dir;if(j<0||j>=grp.length)return;
  [grp[i],grp[j]]=[grp[j],grp[i]];
  const ups=[];grp.forEach((x,k)=>{const o=MODES.indexOf(l.mode)*100+k+1;if(x.ordre!==o){x.ordre=o;ups.push(sb.from("legumes").update({ordre:o}).eq("id",Number(x.id)))}});
  S.legumes.sort((a,b)=>MODES.indexOf(a.mode)-MODES.indexOf(b.mode)||(a.ordre-b.ordre)||(a.id-b.id));render();
  const res=await Promise.all(ups);const er=res.find(r=>r.error);if(er)toast(errMsg(er.error),true);
  await loadRef();render();
}
function setPrice(lid,prix,depuis){
  if(!tarifsOf(lid).length)depuis=PRIX_ORIGINE;
  return sb.from("tarifs").upsert({legume_id:Number(lid),prix,depuis},{onConflict:"legume_id,depuis"});
}

      t.disabled=true;t.textContent=T("sending");
      const {error}=await sb.rpc("enregistrer_journee",{p_date:S.date,p_saisonnier:Number(S.selected),p_quantites:q,p_horaires:horairesDb(h)});
      if(error){toast(errMsg(error),true);t.disabled=false;t.textContent=T("validate");return}
      if(presH(h))S.lastH={...h};
      const n=personName(S.selected);S.selected=null;S.search="";toast(T("saved")+" · "+n);render();loadDay();if(isResp()){loadRange();loadMois()}window.scrollTo(0,0);break}
    case "prev":shiftPeriod(-1);break;
    case "next":shiftPeriod(1);break;
    case "now":S.anchor=today();loadRange();break;
    case "xlsx":doXlsx();break;
    case "csv":doCsv();break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="f-search"){S.search=t.value;render()}
  else if(t.id==="f-ssearch"){S.sSearch=t.value;render()}
  else if(t.dataset&&t.dataset.q){S.draft[t.dataset.q]=t.value;updMeter()}
  else if(t.dataset&&t.dataset.h){S.hdraft[t.dataset.h]=t.value;updMeter()}
  else if(t.dataset&&"keep" in t.dataset){S.form[t.id]=t.value}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="f-date"&&t.value){S.date=t.value;S.selected=null;S.day=null;loadDay()}
  else if(t.dataset&&t.dataset.h){S.hdraft[t.dataset.h]=t.value;updMeter()}
  else if(t.dataset&&"keep" in t.dataset){S.form[t.id]=t.value}
});
document.addEventListener("submit",async e=>{
  const f=e.target;if(f.closest("dialog"))return;
  e.preventDefault();
  const v=id=>(document.getElementById(id)||{}).value||"";
  switch(f.id){
    case "form-login":login(v("l-ident"),v("l-mdp"));break;
    case "form-s":{const nom=v("s-nom").trim(),prenom=v("s-prenom").trim();if(!nom||!prenom)return;
      if(await run(sb.from("saisonniers").insert({nom,prenom}),prenom+" "+nom+" ajouté(e)")){S.form["s-nom"]=S.form["s-prenom"]="";await loadRef();render()}break}
    case "form-l":{const nom=v("l-nom").trim(),nom_pt=v("l-nompt").trim()||null,mode=v("l-mode")||"colis",prixTxt=v("l-prix");if(!nom)return;
      const ordre=MODES.indexOf(mode)*100+S.legumes.filter(l=>l.mode===mode).length+1;
      if(!await run(sb.from("legumes").insert({nom,nom_pt,mode,ordre})))break;
      await loadRef();
      if(prixTxt!==""){const l=S.legumes.filter(x=>x.nom===nom&&x.mode===mode).sort((a,b)=>b.id-a.id)[0];if(l)await run(setPrice(l.id,Math.max(0,Number(prixTxt)),PRIX_ORIGINE))}
      toast(nom+" ajouté");S.form["l-nom"]=S.form["l-nompt"]=S.form["l-prix"]="";await loadRef();render();break}
    case "form-es":{const nom=v("es-nom").trim(),prenom=v("es-prenom").trim();if(!nom||!prenom)return;
      if(await run(sb.from("saisonniers").update({nom,prenom}).eq("id",Number(f.dataset.id)),"Saisonnier modifié")){await loadRef();render()}break}
    case "form-el":{const id=f.dataset.id,nom=v("el-nom").trim(),nom_pt=v("el-nompt").trim()||null,mode=v("el-mode"),prixTxt=v("el-prix"),depuis=v("el-depuis")||today();if(!nom)return;
      const l=legById(id);const upd={nom,nom_pt,mode};if(l&&l.mode!==mode)upd.ordre=MODES.indexOf(mode)*100+S.legumes.filter(x=>x.mode===mode).length+1;
      if(!await run(sb.from("legumes").update(upd).eq("id",Number(id))))break;
      if(prixTxt!==""&&!await run(setPrice(id,Math.max(0,Number(prixTxt)),depuis)))break;
      toast(prixTxt!==""?"Produit et prix enregistrés":"Produit modifié");S.editCfg=null;await loadRef();render();break}
    case "form-smic":{const taux=Number(v("sm-taux")),depuis=v("sm-depuis");if(!(taux>0)||!depuis)return toast("Indiquez un taux et une date.",true);
      if(await run(sb.from("smic").upsert({depuis,taux},{onConflict:"depuis"}),"SMIC enregistré")){S.form["sm-taux"]="";await loadRef();render()}break}
    case "form-u":createAccount();break;
    case "form-eu":{
      const id=f.dataset.id,p=S.profils.find(x=>x.id===id),nom=v("eu-nom").trim(),ident=v("eu-ident").trim().toLowerCase();
      if(!p||!nom||!ident)return toast("Remplissez le nom et l'identifiant.",true);
      const identChange=ident!==p.identifiant;
      if(identChange){
        if(!/^[a-z0-9._-]{2,40}$/.test(ident))return toast("Identifiant invalide : lettres minuscules sans accent, chiffres, point ou tiret.",true);
        const {error}=await sb.rpc("changer_identifiant",{p_user:id,p_ident:ident});
        if(error)return toast(errMsg(error),true);
      }
      const upd={nom};const r=document.getElementById("eu-role");if(r)upd.role=r.value;
      const {data,error}=await sb.from("profils").update(upd).eq("id",id).select("id");
      if(error)return toast(errMsg(error),true);
      if(!data||!data.length)return toast("La base a refusé la modification. Reconnectez-vous avec un compte responsable.",true);
      toast(identChange&&id===S.profil.id?"Compte modifié. Votre identifiant de connexion est maintenant : "+ident:"Compte modifié");
      S.editCfg=null;await loadProfils();
      if(id===S.profil.id){S.profil.nom=nom;S.profil.identifiant=ident}
      render();break}
    case "form-pw":{const mdp=v("pw-new");if(mdp.length<6)return toast("Le mot de passe doit faire au moins 6 caractères.",true);
      if(await run(sb.rpc("changer_mot_de_passe",{p_user:f.dataset.id,p_mdp:mdp}),"Mot de passe changé")){S.editCfg=null;S.form["pw-new"]="";render()}break}
  }
});

/* ---------- démarrage ---------- */
document.documentElement.lang=S.lang;
render();
if(sb){
  sb.auth.getSession().then(({data})=>onSession(data.session));
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="INITIAL_SESSION")return;setTimeout(()=>onSession(session),0)});
}else{S.booting=false;render()}
})();
</script>
</body>
</html>
