<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCEA Guidal – Suivi Récoltes</title>
<meta name="theme-color" content="#1E4736">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guidal Récoltes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
/* Charte SCEA Guidal — variante A « Terroir ». Pour changer de variante, ne modifier que ces deux blocs de couleurs. */
:root{
  --green:#1E4736; --green-ink:#1E4736; --red:#C61D2D; --red-btn:#C61D2D; --ok:#256628; --ok-mark:#50AF54;
  --bg:#F2EFE6; --surface:#FBFAF5; --surface-2:#E9E5D8; --line:#D9D3C2; --field:#8C8676;
  --fg:#1F2A24; --muted:#535E56; --on-green:#F2EFE6; --ok-bg:#E3F1E1; --red-bg:#F8E1E2;
  --warn:#8A5A00; --warn-bg:#FBF0D9; --sun:#9A4A00; --sun-bg:#FDE6CC;
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Montserrat", "Segoe UI", system-ui, sans-serif;
  --r:10px; color-scheme:light;
}
/* Thème sombre : seulement pour le responsable hors de l'écran de saisie, si le téléphone ou l'ordinateur est réglé en mode sombre.
   L'écran de saisie reste toujours clair (lisible en plein soleil). */
:root[data-sombre]{
  --green:#173A2B; --green-ink:#8CC9A0; --red:#E8737D; --red-btn:#B42331; --ok:#7BCB80; --ok-mark:#6CC070;
  --bg:#121A16; --surface:#1A2520; --surface-2:#223029; --line:#2F3F36; --field:#6B7A70;
  --fg:#ECE8DD; --muted:#A3AFA6; --on-green:#F2EFE6; --ok-bg:#1F3524; --red-bg:#3A1C20;
  --warn:#F0C46A; --warn-bg:#3A3018; --sun:#FFA24C; --sun-bg:#3D2810; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.brand{background:var(--green);color:var(--on-green);padding-top:env(safe-area-inset-top,0px)}
header.brand .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.logo{width:48px;height:48px;flex:none}
.brand h1{font-family:var(--display);font-size:1.4rem;margin:0;line-height:1.1}
.brand .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;opacity:.8}
.userbox{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.85rem}
.userbox .role{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.btn-out{background:none;border:1px solid rgba(242,239,230,.45);color:var(--on-green);border-radius:8px;padding:7px 12px;font:600 .8rem var(--body);cursor:pointer;min-height:44px}
.lang{display:inline-flex;border:1px solid rgba(242,239,230,.5);border-radius:99px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:var(--on-green);font:700 .75rem var(--body);padding:7px 13px;cursor:pointer;letter-spacing:.05em;min-height:44px}
.lang button[aria-pressed="true"]{background:var(--on-green);color:#1E4736}
nav.tabs{background:var(--green);border-top:1px solid rgba(255,255,255,.12)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:var(--on-green);opacity:.75;font:600 .9rem var(--body);padding:12px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
main{padding-block:20px calc(60px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--display);font-size:1.5rem;margin:0;color:var(--green-ink);text-wrap:balance}
h3{font-family:var(--display);font-size:1.15rem;margin:0 0 10px;color:var(--green-ink)}
p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input,select{font:500 1rem var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--field);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.btn{font:600 .95rem var(--body);border-radius:8px;padding:11px 18px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.validate{background:var(--red-btn);border-color:var(--red-btn);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--green-ink);padding-inline:6px}
.btn.danger{color:var(--red);border-color:var(--red);background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 12px;min-height:44px;font-size:.85rem}
.btn.ico{padding:4px 9px;min-height:44px;min-width:44px;font-size:.95rem}
.notice{padding:10px 14px;border-radius:8px;background:var(--surface-2);font-size:.9rem}
.notice.err{background:var(--red-bg)}
.notice.warn{background:var(--warn-bg);color:var(--fg)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.todo{background:var(--surface-2);color:var(--muted)}
.badge.off{background:var(--red-bg);color:var(--red)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
/* dimanches en orange */
.badge.sun{background:var(--sun-bg);color:var(--sun)}
.sun{color:var(--sun)!important;font-weight:700}
input.sun{border-color:var(--sun);border-width:2px;background:var(--sun-bg)}
input.err{border-color:var(--red);border-width:2px;background:var(--red-bg)}
.req{color:var(--red);font-weight:700}
tr.sun td{background:var(--sun-bg)}
.dh .badge.sun{background:#FFA24C;color:#2a1600}
.badge.role{background:var(--surface-2);color:var(--green-ink)}
.demo-bar{background:#E0A526;color:#2a1f00;font-size:.8rem;font-weight:600;text-align:center;padding:6px 12px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.demo-bar button{font:600 .75rem var(--body);border:1px solid #2a1f00;background:none;border-radius:6px;padding:3px 9px;cursor:pointer;color:#2a1f00}
/* Connexion */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.login .top{background:var(--green);color:var(--on-green);padding:24px;text-align:center}
.login .top svg{width:84px;height:84px}
.login .top h1{font-family:var(--display);margin:8px 0 2px;font-size:1.6rem}
.login form,.login .demo{padding:22px;display:flex;flex-direction:column;gap:14px}
/* Saisie */
.people{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.person{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:60px;width:100%}
.person:last-child{border-bottom:0}
.person:hover{background:var(--surface-2)}
.person .nm{font-weight:600;flex:1;min-width:0}
.person .sum{font-size:.8rem;color:var(--muted);font-weight:500}
.sec{display:flex;align-items:center;gap:10px;margin-top:6px}
.sec h4{margin:0;font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--green-ink)}
.sec .ln{flex:1;height:1px;background:var(--line)}
.sec .chip{font-size:.72rem;font-weight:600;color:var(--muted)}
.grid-q{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.qrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.qrow.filled{border-color:var(--ok-mark);box-shadow:inset 3px 0 0 var(--ok-mark)}
.qrow .lg{font-weight:600}
.qrow .un{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--green-ink);font:700 1.4rem var(--body);cursor:pointer;line-height:1}
.stepper input{width:84px;text-align:center;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;padding-inline:4px}
.hours{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.hcard .hd{font-weight:700;margin-bottom:8px}
.hcard .tm{display:flex;align-items:center;gap:8px}
.hcard .tm input{font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.total{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--green);color:var(--on-green);border-radius:var(--r);padding:10px 16px;font-weight:600;flex-wrap:wrap}
.total strong{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.total .btn{background:none;color:var(--on-green);border-color:rgba(242,239,230,.45)}
.meter{font-size:.85rem;padding:10px 14px;border-radius:8px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.meter.over{background:var(--red-bg);color:var(--red)}
.meter.info{background:var(--surface-2);color:var(--muted)}
.actionbar{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;border-top:1px solid var(--line);margin-top:4px}
.actionbar .btn.validate{flex:1;font-size:1.05rem}
/* Supervision */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px;font:600 .88rem var(--body);color:var(--fg);cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.periodnav{display:flex;align-items:center;gap:4px}
.periodnav strong{min-width:190px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tile .v{font-family:var(--display);font-size:1.9rem;color:var(--green-ink);font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:.8rem;color:var(--muted)}
.tile.money{background:var(--green);border-color:var(--green)}
.tile.money .v,.tile.money .l{color:var(--on-green)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.grp{background:var(--surface-2);font-weight:700;color:var(--green-ink)}
tfoot td{font-weight:700;border-bottom:0;background:var(--surface-2)}
tr[data-sel-s]{cursor:pointer}
tr[data-sel-s]:hover td{background:var(--surface-2)}
tr.sel td,tr.sel:hover td{background:var(--ok-bg)}
.zero{color:var(--muted)}
.eur{font-weight:700;color:var(--green-ink)}
details>summary{cursor:pointer;font-family:var(--display);font-size:1.15rem;color:var(--green-ink);margin-bottom:10px}
/* Paramètres */
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.listcfg{display:flex;flex-direction:column}
.listcfg .it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.listcfg .it:last-child{border-bottom:0}
.listcfg .it .nm{flex:1;min-width:140px;font-weight:600}
.listcfg .it.edit{align-items:flex-end}
.listcfg .it.edit input,.listcfg .it.edit select{flex:1;min-width:110px;width:auto;min-height:38px;padding:7px 10px}
td form.inl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end;white-space:normal;padding:4px 0}
td form.inl input,td form.inl select{min-height:38px;padding:7px 10px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,20,15,.55)}
dialog .dh{padding:16px 18px;background:var(--green);color:var(--on-green)}
dialog .dh h3{color:var(--on-green);margin:0}
dialog .db{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
/* Écran d'accueil « Lever du jour » (identique en mode clair et sombre) */
.splash{position:fixed;inset:0;z-index:100;background:#F2EFE6;color:#1E4736;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:env(safe-area-inset-top,0px) 16px calc(110px + env(safe-area-inset-bottom,0px))}
.splash .em{width:120px;height:120px;animation:sp-pop .9s ease-out both}
.splash .ttl{font-family:var(--display);font-size:2.2rem;font-weight:700;margin:16px 0 4px;letter-spacing:.01em}
.splash .tg{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#5E6A61}
.splash .dots{display:flex;gap:8px;margin-top:28px}
.splash .dots i{width:9px;height:9px;border-radius:50%;background:#C61D2D;animation:sp-blink 1.2s infinite}
.splash .dots i:nth-child(2){animation-delay:.2s}.splash .dots i:nth-child(3){animation-delay:.4s}
.splash .field{position:absolute;left:0;right:0;bottom:0;height:calc(100px + env(safe-area-inset-bottom,0px));background:#1E4736}
.splash .field svg{display:block;width:100%;height:100px}
.splash .ft{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:.72rem;letter-spacing:.08em;color:#F2EFE6;opacity:.85}
@keyframes sp-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sp-pop{0%{transform:translateY(14px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.splash .em,.splash .dots i{animation:none}}
.qrbox{background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center;align-self:center}
.qrbox svg{width:220px;height:220px;display:block}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--green);color:var(--on-green);padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:200;width:max-content;max-width:min(560px,calc(100vw - 32px));text-align:left}
.toast.err{background:var(--red-btn)}
.split.wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:860px){.split,.split.wide{grid-template-columns:minmax(0,1fr)}}
.addform .btn{white-space:normal}
/* tableaux trop larges : ombre sur le bord pour montrer qu'on peut faire défiler */
.tscroll{background:linear-gradient(to right,var(--surface) 30%,rgba(0,0,0,0)) left/40px 100% no-repeat local,linear-gradient(to left,var(--surface) 30%,rgba(0,0,0,0)) right/40px 100% no-repeat local,radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.22),rgba(0,0,0,0)) left/14px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.22),rgba(0,0,0,0)) right/14px 100% no-repeat scroll,var(--surface)}
.tscroll td,.tscroll th{background-clip:padding-box}
.pick-edit{all:unset;cursor:pointer;color:var(--green-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.datewarn{font-size:.85rem;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px}
.prefill{font-size:.8rem;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer}
.chk input{width:24px;height:24px;min-height:0;margin:0;accent-color:var(--red-btn)}
.clearrow{display:flex;justify-content:flex-start}
td .btn.sm,td .btn.ico{min-height:40px}
/* supervision : cartes sur téléphone à la place du tableau */
.cards{display:none;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.card .meta{font-size:.85rem;color:var(--muted)}
@media (max-width:640px){.cards{display:flex}.tscroll.det{display:none}}
.journal{font-size:.85rem;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.journal div{border-bottom:1px solid var(--line);padding:4px 0}
@media (max-width:640px){
  .userbox{margin-left:0;width:100%;justify-content:space-between}
  .periodnav strong{min-width:0;flex:1}
  .periodnav{width:100%}
  h2{font-size:1.3rem}
  .stepper input{width:70px}
  td.realise{min-width:150px!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Fiche de travail imprimable */
#printzone{display:none}
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff!important;color:#111!important;min-height:0}
  body>*:not(#printzone){display:none!important}
  #printzone{display:block!important;font-family:var(--body);color:#111;font-size:10.5pt}
  .pf h1{font-family:var(--display);color:#1E4736;margin:0;font-size:20pt}
  .pf h2{font-family:var(--display);color:#1E4736;font-size:12.5pt;margin:16px 0 6px}
  .pf-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px solid #1E4736;padding-bottom:8px}
  .pf-tag{font-size:8pt;letter-spacing:.12em;text-transform:uppercase;color:#C61D2D;font-weight:700}
  .pf-who{text-align:right;font-size:11pt}
  .pf-small{font-size:8.5pt;color:#555}
  .pf-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  .pf-tiles div{border:1px solid #bbb;border-radius:6px;padding:6px 8px;font-size:8.5pt;color:#444}
  .pf-tiles b{display:block;font-size:14pt;color:#1E4736;font-family:var(--display)}
  .pf table{width:100%;border-collapse:collapse;font-size:9pt}
  .pf th,.pf td{border-bottom:1px solid #ccc;padding:4px 6px;text-align:left;white-space:normal;color:#111;background:none}
  .pf th{background:#F2EFE6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:7.5pt;text-transform:uppercase;letter-spacing:.04em;color:#444}
  .pf td.n,.pf th.n{text-align:right;font-variant-numeric:tabular-nums}
  .pf tr.tot td{font-weight:700;border-top:2px solid #1E4736;background:none}
  .pf tr.sun td{background:#FDE6CC!important;color:#8A3F00;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pf-alert{border:1px solid #C61D2D;color:#C61D2D;padding:6px 8px;border-radius:6px;margin-top:10px}
  .pf-sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px;break-inside:avoid}
  .pf-sign div{border-top:1px solid #999;padding-top:4px;height:64px;font-size:8.5pt;color:#555}
  .pf tr{break-inside:avoid}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}

function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const fmtLong=(s,loc)=>new Intl.DateTimeFormat(loc||"fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(parse(s));
const fmtDate=s=>s===PRIX_ORIGINE?"toujours":new Intl.DateTimeFormat("fr-FR").format(parse(s));

/* noms affichés « Prénom NOM », listes triées par prénom puis nom */

function sortedPeople(list){return list.slice().sort((a,b)=>(a.prenom+" "+a.nom).localeCompare(b.prenom+" "+b.nom,"fr"))}

/* unités : « 3 colis », « 1 unité », « 120 unités », « 2,5 h » */
function unitShort(mode,n,lang){
  if(mode==="heure")return "h";
  if(lang==="pt")return mode==="colis"?(Math.abs(n)<2?"caixa":"caixas"):(Math.abs(n)<2?"unidade":"unidades");
  return mode==="colis"?"colis":(Math.abs(n)<2?"unité":"unités");
}
/* horaires : « 07:30 » ; durées en heures décimales ; affichage « 8 h 30 » */
const fmtT=s=>s?String(s).slice(0,5):"";
function tmin(s){if(!s)return null;const [h,m]=String(s).slice(0,5).split(":").map(Number);return h*60+m}
function span(a,b){const x=tmin(a),y=tmin(b);return x!=null&&y!=null&&y>x?(y-x)/60:0}
const presH=h=>h?span(h.md,h.mf)+span(h.ad,h.af):0;
function fmtH(h){const t=Math.round((h||0)*60);return Math.floor(t/60)+" h "+pad(t%60)}

function sliceHalf(e,half){
  const h=e.h||{};
  if(half==="matin")return {date:e.date,sid:e.sid,q:e.qm,h:{md:h.md,mf:h.mf,xm:h.xm}};
  if(half==="am")return {date:e.date,sid:e.sid,q:e.qa,h:{ad:h.ad,af:h.af,xa:h.xa}};
  return {date:e.date,sid:e.sid,q:e.q,h};

  const has=Object.values(q).some(v=>v>0);
  if(!x&&!d&&!has)return null;
  return {d:d||"",f:f||"",absent:!!x,q};
}

function loadDraft(){

  else{const last=lastHours(S.shalf);if(last){S.hd={...last};S.prefilled=true}} /* horaires de la saisie précédente, à vérifier */
}

function rememberHours(H,hd){S.lastH[H]={date:S.date,d:hd.d,f:hd.f};store("guidal.lastH",JSON.stringify(S.lastH))}

  const saved=st?st.q:{};const ks=new Set([...Object.keys(S.draft),...Object.keys(saved)]);
  for(const k of ks)if((num(S.draft[k])||0)!==(Number(saved[k])||0))return true;
  if(S.prefilled)return false;

/* Traduit une erreur technique en message clair (français ou portugais), orienté action.
   Les messages « La base doit être mise à jour » ne s'affichent que si une fonction ou une colonne manque vraiment. */
const MAJ=f=>`La base doit être mise à jour : exécutez le fichier supabase/${f} dans Supabase (voir le guide).`;
function errMsg(e,lang){
  const L=I18N[lang||(isResp()&&S.view!=="saisie"?"fr":S.lang)]||I18N.fr,t=k=>L[k]??I18N.fr[k];
  const m=(e&&(e.message||e.error_description))||String(e||"");
  const code=(e&&e.code)||"";
  if(/Failed to fetch|NetworkError|Load failed|network request failed|ERR_INTERNET|ERR_NETWORK|TypeError: fetch/i.test(m))return t("errNet");
  /* contrôles faits par la base (maj-06) */
  if(/Horaires obligatoires/.test(m))return t("errHours");
  if(/Horaires incomplets/.test(m))return t("errPair");
  if(/fin doit être après/.test(m))return t("errOrder");
  if(/dépassent la présence/.test(m))return t("errOver");
  if(/quantité négative/i.test(m))return t("errNeg");
  if(/date future/i.test(m))return t("errFuture");
  if(/row-level security|permission denied|violates row-level/i.test(m)||code==="42501")return t("errRights");
  /* fonction absente : la base n'a pas reçu la mise à jour correspondante */
  const fn=/(?:function|Could not find the function)\s+(?:public\.)?([a-z_]+)/i.exec(m);
  if(fn&&(/does not exist|Could not find/i.test(m)||code==="PGRST202"||code==="42883")){
    const f=fn[1];
    if(f==="changer_identifiant")return MAJ("maj-01-identifiant.sql");
    if(f==="enregistrer_demi_journee")return MAJ("maj-05-demi-journees.sql");
    if(f==="corriger_journee"||f==="effacer_journee")return MAJ("maj-06-securite-et-controles.sql");
  }
  /* colonne ou table absente */
  const col=/column\s+(?:[a-z_]+\.)?"?([a-z_]+)"?\s+(?:of relation\s+"?([a-z_]+)"?\s+)?does not exist|Could not find the '([a-z_]+)' column of '([a-z_]+)'/i.exec(m);
  if(col){const c=col[1]||col[3],tb=col[2]||col[4]||"";
    if(["periode","matin_absent","am_absent"].includes(c))return MAJ("maj-05-demi-journees.sql");
    if(c==="bottes_par_colis")return MAJ(tb==="tarifs"?"maj-06-securite-et-controles.sql":"maj-04-bottes-par-colis.sql");
    if(["mode","nom_pt"].includes(c))return MAJ("maj-02-paie.sql");
  }
  if(/relation\s+"?(?:public\.)?(presences|tarifs|smic)"?\s+does not exist|Could not find the table 'public\.(presences|tarifs|smic)'/i.test(m))return MAJ("maj-02-paie.sql");
  if(/violates foreign key constraint .*saisonnier/i.test(m))return MAJ("maj-03-suppression-saisonnier.sql");
  if(/Réservé|caractères|Identifiant invalide|existe déjà|introuvable|Invitation/.test(m))return m;
  return t("errGeneric")+m;
}
/* ---------- hors connexion : copies locales et file d'attente des saisies ---------- */
const isNetErr=e=>/Failed to fetch|NetworkError|Load failed|network request failed|ERR_INTERNET|ERR_NETWORK/i.test((e&&(e.message||e.error_description))||String(e||""));
const ckey=k=>"guidal.cache."+k+"."+((S.session&&S.session.user.id)||"");
function cacheSet(k,v){store(ckey(k),JSON.stringify(v))}
function cacheGet(k){try{return JSON.parse(load(ckey(k))||"null")}catch(e){return null}}
const QKEY="guidal.attente";
function queueAll(){try{return JSON.parse(load(QKEY)||"[]")}catch(e){return []}}
function queueMine(){const u=S.profil&&S.profil.id;return queueAll().filter(x=>x.uid===u)}
function queueSave(q){store(QKEY,JSON.stringify(q));S.queue=queueMine()}
/* une demi-journée gardée sur le téléphone remplace la précédente en attente pour la même personne */
function enqueue(args){
  const uid=S.profil.id,key=[uid,args.p_date,args.p_saisonnier,args.p_periode].join("|");
  const q=queueAll().filter(x=>x.key!==key);q.push({key,uid,args,at:Date.now(),err:""});queueSave(q);
}
let flushing=false;
async function flushQueue(){
  if(flushing||!S.profil||!S.profil.actif)return;
  const mine=queueMine().filter(x=>!x.err);if(!mine.length)return;
  flushing=true;let sent=0,netDown=false;
  for(const it of mine){
    const {error}=await sb.rpc("enregistrer_demi_journee",it.args);
    if(error&&isNetErr(error)){netDown=true;break}
    const q=queueAll().filter(x=>x.key!==it.key);
    if(error)q.push({...it,err:errMsg(error)});else sent++;
    queueSave(q);
  }
  flushing=false;S.offline=netDown;
  if(sent){toast(T("queueSent",sent));reloadData(true)}else render();
}
/* ajoute les saisies en attente à la journée affichée (badge « En attente d'envoi ») */
function overlayQueue(m){
  for(const it of queueMine()){const a=it.args;if(a.p_date!==S.date)continue;
    const sid=String(a.p_saisonnier);const e=m[sid]||(m[sid]={date:a.p_date,sid,q:{},qm:{},qa:{},h:null,par:null,corr:null});
    const H=a.p_periode,qq={};if(!a.p_absent)for(const [k,v] of Object.entries(a.p_quantites||{}))if(v>0)qq[k]=v;
    if(H==="matin")e.qm=qq;else e.qa=qq;
    e.q={};for(const src of [e.qm,e.qa])for(const [k,v] of Object.entries(src))e.q[k]=(e.q[k]||0)+v;
    e.h={...(e.h||{})};if(H==="matin"){e.h.md=a.p_debut||"";e.h.mf=a.p_fin||"";e.h.xm=!!a.p_absent}else{e.h.ad=a.p_debut||"";e.h.af=a.p_fin||"";e.h.xa=!!a.p_absent}
    e.pend={...(e.pend||{}),[H]:it.err||true};
  }
  return m;
}
window.addEventListener("online",()=>{S.offline=false;flushQueue()});
window.addEventListener("offline",()=>{S.offline=true;render()});
setInterval(()=>{if(navigator.onLine!==false)flushQueue()},30000);

const BKEY="guidal.brouillon";
function saveBrouillon(){try{if(!S.selected||!S.profil)return sessionStorage.removeItem(BKEY);

function takeBrouillon(){try{const b=JSON.parse(sessionStorage.getItem(BKEY)||"null");sessionStorage.removeItem(BKEY);return b}catch(e){return null}}
let pendingRestore=null;
const isMissingFn=(e,name)=>!!e&&(e.code==="PGRST202"||e.code==="42883"||/Could not find the function|does not exist/i.test(e.message||""))&&new RegExp(name).test(e.message||"");

/* ---------- tarifs ----------
   Au colis : le prix saisi est celui d'UNE BOTTE ; montant = colis × bottes par colis × prix de la botte.
   Le prix ET le nombre de bottes par colis sont datés (table tarifs, maj-06) : on applique ceux en vigueur à la date de la saisie.
   Avant maj-06, le nombre de bottes par colis vient de la fiche produit. */
const HAS_BPC=()=>S.legumes.some(l=>l.bottes_par_colis!=null);
let HAS_TBPC=false; /* vrai si la table tarifs a la colonne bottes_par_colis (maj-06) */
const priceUnit=l=>l.mode==="heure"?"h":l.mode==="colis"?"botte":"unité";
function tarifAt(lid,date){let b=null;for(const t of S.tarifs)if(t.lid===String(lid)&&t.depuis<=date&&(!b||t.depuis>b.depuis))b=t;return b}
function priceAt(lid,date){const t=tarifAt(lid,date);return t?t.prix:null}
/* bottes par colis : celles du tarif en vigueur à la date, sinon celles de la fiche produit */
function bpcAt(l,date){
  if(!l||l.mode!=="colis")return 1;
  const t=date?tarifAt(l.id,date):null;
  return (t&&t.bpc)||Number(l.bottes_par_colis)||1;
}
const bpc=l=>bpcAt(l,today());
function smicAt(date){let b=null;for(const t of S.smic)if(t.depuis<=date&&(!b||t.depuis>b.depuis))b=t;return b?b.taux:null}
const tarifsOf=lid=>S.tarifs.filter(t=>t.lid===String(lid)).sort((a,b)=>b.depuis.localeCompare(a.depuis));
/* montant d'une ligne (produit × quantité à une date), arrondi au centime */
function lineAmount(l,q,date){const p=priceAt(l.id,date);return p==null?null:r2(p*q*bpcAt(l,date))}
/* montant d'une journée */
function value(e){
  const v={tache:0,heure:0,total:0,colis:0,unites:0,hh:0,pres:presH(e.h),smicMin:0,missing:false};
  for(const [k,q] of Object.entries(e.q)){
    if(!(q>0))continue;const l=legById(k);if(!l)continue;
    const m=lineAmount(l,q,e.date);if(m==null)v.missing=true;
    if(l.mode==="heure"){v.hh+=q;v.heure+=m||0}else{v.tache+=m||0;if(l.mode==="colis")v.colis+=q;else v.unites+=q}
  }
  v.tache=r2(v.tache);v.heure=r2(v.heure);v.total=r2(v.tache+v.heure);const sm=smicAt(e.date);if(sm)v.smicMin=r2(v.hh*sm);
  return v;
}

/* ---------- périodes ---------- */
function periodRange(){
  const a=S.anchor;
  if(S.period==="jour")return [a,a];
  if(S.period==="semaine"){const d=parse(a);const dow=(d.getDay()+6)%7;const start=addDays(a,-dow);return [start,addDays(start,6)]}
  return monthRange(a);
}
function monthRange(a){const d=parse(a);return [iso(new Date(d.getFullYear(),d.getMonth(),1)),iso(new Date(d.getFullYear(),d.getMonth()+1,0))]}
const monthLabel=a=>new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric"}).format(parse(a));
function periodLabel(){
  const [a,b]=periodRange();
  if(S.period==="jour")return fmtLong(a);
  if(S.period==="mois")return monthLabel(a);
  return "Semaine du "+fmtDay(a)+" au "+fmtDay(b);
}
function shiftPeriod(dir){
  if(S.period==="jour")S.anchor=addDays(S.anchor,dir);
  else if(S.period==="semaine")S.anchor=addDays(S.anchor,7*dir);
  else{const d=parse(S.anchor);S.anchor=iso(new Date(d.getFullYear(),d.getMonth()+dir,1))}
  loadRange();
}

/* ---------- données ---------- */
async function fetchAll(table,cols,a,b){
  const out=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from(table).select(cols).gte("date",a).lte("date",b).order("id").range(from,from+999);
    if(error)throw error;
    out.push(...data);
    if(data.length<1000)break;
  }
  return out;
}
async function fetchDays(a,b){
  const [r,p]=await Promise.all([
    fetchAll("recoltes","date,saisonnier_id,legume_id,quantite,periode,saisi_par,corrige_par",a,b),
    fetchAll("presences","date,saisonnier_id,matin_debut,matin_fin,am_debut,am_fin,matin_absent,am_absent,saisi_par,corrige_par",a,b)]);
  const m={};
  const get=(d,s,par)=>{const k=d+"|"+s;return m[k]||(m[k]={date:d,sid:String(s),q:{},qm:{},qa:{},h:null,par,corr:null})};
  for(const x of r){const e=get(x.date,x.saisonnier_id,x.saisi_par);const k=String(x.legume_id),v=Number(x.quantite);
    (x.periode==="am"?e.qa:e.qm)[k]=v;e.q[k]=(e.q[k]||0)+v;if(x.corrige_par)e.corr=x.corrige_par}
  for(const x of p){const e=get(x.date,x.saisonnier_id,x.saisi_par);e.h={md:fmtT(x.matin_debut),mf:fmtT(x.matin_fin),ad:fmtT(x.am_debut),af:fmtT(x.am_fin),xm:!!x.matin_absent,xa:!!x.am_absent};if(x.corrige_par)e.corr=x.corrige_par}
  return Object.values(m).sort((x,y)=>x.date.localeCompare(y.date)||personName(x.sid).localeCompare(personName(y.sid),"fr"));
}
async function loadRef(){
  const [s,l]=await Promise.all([
    sb.from("saisonniers").select("id,nom,prenom,actif"),
    sb.from("legumes").select("*").order("ordre").order("id")]);
  const er=s.error||l.error;
  if(er){const c=isNetErr(er)&&cacheGet("ref");if(!c)throw er;S.offline=true;s.data=c.s;l.data=c.l}
  else cacheSet("ref",{s:s.data,l:l.data.map(x=>({id:x.id,nom:x.nom,nom_pt:x.nom_pt,mode:x.mode,actif:x.actif,ordre:x.ordre,bottes_par_colis:x.bottes_par_colis}))});
  S.saisonniers=s.data.map(x=>({...x,id:String(x.id)}));
  S.legumes=l.data.map(x=>({...x,id:String(x.id)})).sort((a,b)=>MODES.indexOf(a.mode)-MODES.indexOf(b.mode)||(a.ordre-b.ordre)||(a.id-b.id));
  if(isResp()&&!er){
    const [t,m]=await Promise.all([sb.from("tarifs").select("*"),sb.from("smic").select("depuis,taux")]);
    if(t.error)throw t.error; if(m.error)throw m.error;
    if(t.data.length)HAS_TBPC="bottes_par_colis" in t.data[0];
    else{const c=await sb.from("tarifs").select("bottes_par_colis").range(0,0);HAS_TBPC=!c.error}
    S.tarifs=t.data.map(x=>({id:x.id,lid:String(x.legume_id),prix:Number(x.prix),depuis:x.depuis,bpc:x.bottes_par_colis!=null?Number(x.bottes_par_colis):null}));
    S.smic=m.data.map(x=>({depuis:x.depuis,taux:Number(x.taux)}));
  }
}
async function loadDay(){
  const t=++dayToken;
  try{const ents=await fetchDays(S.date,S.date);if(t!==dayToken)return;
    const m={};for(const e of ents)m[e.sid]=e;cacheSet("day."+S.date,ents);S.day=overlayQueue(m);S.offline=false}
  catch(e){if(t===dayToken){
    /* sans réseau : dernière copie de la journée gardée sur le téléphone */
    const c=isNetErr(e)?cacheGet("day."+S.date):null;const m={};
    if(isNetErr(e)){S.offline=true;if(c)for(const x of c)m[x.sid]=x}else toast(errMsg(e),true);
    S.day=overlayQueue(m)}}
  if(pendingRestore&&t===dayToken){const b=pendingRestore;pendingRestore=null;
    if(b.date===S.date&&S.saisonniers.some(p=>p.id===b.sid&&p.actif)){S.selected=b.sid;S.shalf=b.shalf;S.shalfAuto=false;loadDraft();S.draft=b.draft||{};S.hd=b.hd||{d:"",f:""};S.absent=!!b.absent;S.prefilled=false;
      try{history.pushState({g:"fiche"},"")}catch(e){}toast(T("restored"))}}
  render();
}
/* keep = mise à jour en arrière-plan (temps réel) : on garde l'affichage actuel jusqu'à l'arrivée des nouvelles données */
async function loadRange(keep){
  if(!isResp())return;
  const t=++rangeToken;if(!keep){S.range=null;render()}
  const [a,b]=periodRange();
  try{const ents=await fetchDays(a,b);if(t!==rangeToken)return;S.range=ents;
    if(sameAsMois())S.mois=ents}
  catch(e){if(t===rangeToken){if(!keep)S.range=[];toast(errMsg(e),true)}}
  render();
}
/* le mois en cours est déjà chargé par la supervision : pas besoin de le télécharger deux fois */
function sameAsMois(){if(S.period!=="mois")return false;const [a]=periodRange();return a===monthRange(today())[0]}
async function loadMois(){
  if(!isResp())return;
  const t=++moisToken;const [a,b]=monthRange(today());
  try{const ents=await fetchDays(a,b);if(t!==moisToken)return;S.mois=ents}
  catch(e){if(t===moisToken){S.mois=[];toast(errMsg(e),true)}}
  render();
}
/* recharge tout ce qui est affiché (après une saisie, une correction…) */
function reloadData(keep){loadDay();if(isResp()){loadRange(keep);if(!sameAsMois())loadMois()}}
async function loadProfils(){
  if(!isResp())return;
  const [p,i]=await Promise.all([sb.from("profils").select("*").order("nom"),sb.from("invitations").select("*").order("nom")]);
  if(!p.error)S.profils=p.data; if(!i.error)S.invitations=i.data;
}
let reloadRef=false;
function scheduleReload(what){
  if(what==="ref")reloadRef=true; /* on n'oublie pas un rechargement des listes si plusieurs événements arrivent */
  clearTimeout(reloadT);
  reloadT=setTimeout(async()=>{
    const ref=reloadRef;reloadRef=false;
    try{if(ref)await loadRef();}catch(e){}
    reloadData(true);
  },400);
}
function subscribe(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel("guidal-live");
  for(const t of ["recoltes","presences"])chan.on("postgres_changes",{event:"*",schema:"public",table:t},()=>scheduleReload("rec"));
  for(const t of ["saisonniers","legumes","tarifs","smic"])chan.on("postgres_changes",{event:"*",schema:"public",table:t},()=>scheduleReload("ref"));
  chan.subscribe();
}
/* Date du jour : si l'app reste ouverte d'un jour à l'autre (ou passe midi), la date et la demi-journée se mettent à jour toutes seules,
   sauf si l'utilisateur a choisi lui-même une autre date ou une autre demi-journée. */
let lastToday=today();
function checkNewDay(){
  if(!S.profil||!S.profil.actif)return;
  const t=today();let changed=false;
  if(t!==lastToday){
    lastToday=t;
    if(S.dateAuto&&S.date!==t){S.date=t;S.day=null;S.selected=null;S.shalf=autoHalf();S.shalfAuto=true;changed=true;toast(T("newDay"));loadDay()}
  }
  if(S.shalfAuto&&!S.selected&&S.shalf!==autoHalf()){S.shalf=autoHalf();changed=true}
  if(changed)render();
}
setInterval(checkNewDay,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.profil&&S.profil.actif){checkNewDay();scheduleReload("ref")}});

/* ---------- session ---------- */
async function onSession(session){
  const prev=S.session&&S.session.user.id;
  S.session=session;
  if(session&&prev===session.user.id&&S.profil)return;
  if(chan){sb.removeChannel(chan);chan=null}
  S.profil=null;S.day=null;S.range=null;S.mois=null;S.profils=[];S.selected=null;S.editCfg=null;S.tarifs=[];S.smic=[];S.selS=null;
  if(!session){await splashWait();S.booting=false;render();tryStoredCredential();return}
  S.booting=true;render();
  const {data,error}=await sb.from("profils").select("*").eq("id",session.user.id).maybeSingle();
  /* erreur réseau : ce n'est pas un compte désactivé, on propose de réessayer */
  let prof=data;
  if(error){const c=isNetErr(error)&&cacheGet("profil");
    if(!c||c.id!==session.user.id){await splashWait();S.netErr=true;S.booting=false;render();return}
    prof=c;S.offline=true}
  else if(data)cacheSet("profil",data);
  S.netErr=false;
  if(!prof||!prof.actif){await splashWait();S.profil={blocked:true,actif:false,nom:prof?prof.nom:""};S.booting=false;render();return}
  S.profil=prof;S.queue=queueMine();
  {const b=takeBrouillon();if(b&&b.uid===prof.id)pendingRestore=b}
  const v=load("guidal.view");S.view=(isResp()&&["saisie","supervision","saisonniers","produits","equipe"].includes(v))?v:"saisie";
  try{await loadRef();await loadProfils()}catch(e){toast(errMsg(e),true)}
  await splashWait();
  S.booting=false;
  lastToday=today();
  loadDay();loadRange();loadMois();subscribe();render();flushQueue();
}
/* Biométrie : le téléphone propose le mot de passe enregistré après Face ID / empreinte (Android : Credential Management ; iPhone : trousseau iCloud via le remplissage automatique) */
let credTried=false;
async function tryStoredCredential(){
  if(DEMO||credTried||!window.PasswordCredential||!navigator.credentials)return;
  credTried=true;
  try{const c=await navigator.credentials.get({password:true,mediation:"optional"});
    if(c&&c.password&&!S.session){S.form["l-ident"]=c.id;login(c.id,c.password)}}catch(e){}
}
async function login(ident,mdp){
  ident=ident.trim().toLowerCase();
  if(!ident||!mdp){S.loginErr="Saisissez votre identifiant et votre mot de passe.";render();return}
  S.loginBusy=true;S.loginErr="";render();
  const email=ident.includes("@")?ident:ident+"@"+DOMAIN;
  const {error}=await sb.auth.signInWithPassword({email,password:mdp});
  S.loginBusy=false;
  if(!error&&!DEMO&&window.PasswordCredential&&navigator.credentials){try{await navigator.credentials.store(new PasswordCredential({id:ident,password:mdp,name:ident}))}catch(e){}}
  if(error){
    S.loginErr=/Invalid login/i.test(error.message)?"Identifiant ou mot de passe incorrect.":
      /not confirmed/i.test(error.message)?"Compte pas encore confirmé. Le responsable doit désactiver « Confirm email » dans Supabase (voir le guide).":errMsg(error);
    render();
  }
}

/* ---------- rendu ---------- */
const logo=(cls)=>`<svg class="${cls||"logo"}" aria-hidden="true"><use href="#radis"/></svg>`;
function render(){
  const root=document.getElementById("root");
  const active=document.activeElement;const fid=active&&active.id;let caret=null;try{caret=active&&active.selectionStart}catch(e){}
  const sombre=!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)&&isResp()&&S.view!=="saisie"&&!S.booting;
  document.documentElement.toggleAttribute("data-sombre",sombre);
  root.innerHTML=(DEMO&&!S.booting?demoBar():"")+renderScreen();
  if(fid){const el=document.getElementById(fid);if(el&&(el.tagName==="INPUT"||el.tagName==="SELECT")){el.focus();try{if(caret!=null)el.setSelectionRange(caret,caret)}catch(e){}}}
}
const demoBar=()=>`<div class="demo-bar">MODE DÉMO · données fictives, rien n'est envoyé à la vraie base <button data-act="demo-reset">Réinitialiser la démo</button></div>`;
function renderScreen(){
  if(!CONFIGURED)return screenMsg("Configuration à terminer","Renseignez l'adresse et la clé de votre projet Supabase dans le fichier <b>config.js</b>, comme indiqué dans le guide d'installation.");
  if(!sb)return screenMsg("Chargement impossible","La bibliothèque de connexion n'a pas pu être chargée. Vérifiez la connexion internet puis rechargez la page.");
  if(S.booting)return SPLASH;
  if(!S.session)return screenLogin();
  if(S.netErr)return screenMsg(T("netTitle"),T("netBody"),true,`<button class="btn primary" data-act="retry">${T("retry")}</button>`);
  if(!S.profil||S.profil.blocked)return screenMsg("Compte non activé","Ce compte n'a pas accès à l'application, ou il a été désactivé. Contactez le responsable de l'exploitation.",true);
  return screenApp();
}

function screenApp(){
  const resp=isResp();const view=resp?S.view:"saisie";
  const tabs=[["saisie","Saisie"],["supervision","Supervision"],["saisonniers","Saisonniers"],["produits","Produits et tarifs"],["equipe","Équipe"]];
  let body;
  if(view==="saisie")body=viewSaisie();
  else if(view==="supervision")body=viewSupervision();
  else if(view==="saisonniers")body=viewSaisonniers();
  else if(view==="produits")body=viewProduits();

/* --- Saisie --- */
function summary(e,lang){
  const parts=[];if(e.h&&presH(e.h))parts.push(fmtH(presH(e.h)));
  for(const l of S.legumes){const q=Number(e.q[l.id]);if(q>0){const nm=(lang==="pt"&&l.nom_pt?l.nom_pt:l.nom).toLowerCase();parts.push(fmtN(q)+" "+unitShort(l.mode,q,lang)+" "+nm)}}
  return parts.join(" · ");
}
function meterHtml(){
  const pres=span(S.hd.d,S.hd.f);let hh=0;
  for(const l of activeLegumes())if(l.mode==="heure")hh+=Math.max(0,num(S.draft[l.id])||0);
  if(!pres)return `<div class="meter info">${T("mInfo")}</div>`;
  if(hh>pres+1e-9)return `<div class="meter over">${T("mOver",fmtH(hh),fmtH(pres))}</div>`;
  return `<div class="meter">${T("mOk",fmtH(hh),fmtH(pres-hh),fmtH(pres))}</div>`;
}
function updMeter(){
  const m=document.getElementById("meter");if(m)m.innerHTML=meterHtml();
  const p=document.getElementById("pres-tot");if(p)p.textContent=fmtH(span(S.hd.d,S.hd.f));
  document.querySelectorAll("[data-q]").forEach(i=>{const r=i.closest(".qrow");const n=num(i.value);if(r)r.classList.toggle("filled",n>0);i.classList.toggle("err",!(n>=0))});
}
const timeInput=(k,label)=>`<input type="time" id="h-${k}" data-h="${k}" step="300" value="${esc(S.hd[k]||"")}" aria-label="${esc(label)}">`;
const halfSeg=()=>`<div class="seg" role="group" aria-label="${T("horaires")}">${["matin","am"].map(h=>`<button data-shalf="${h}" aria-pressed="${S.shalf===h}">${h==="matin"?"☀ ":"◐ "}${T(h)}</button>`).join("")}</div>`;

      <div class="sec"><h4>${T("horaires")} · ${esc(lab)} <span class="req">*</span></h4><span class="ln"></span><span class="chip req">${T("required")}</span></div>
      <div class="hours"><div class="hcard"><div class="hd">${H==="matin"?"☀":"◐"} ${esc(lab)}</div><div class="tm">${timeInput("d",lab+" "+T("debut"))}<span>–</span>${timeInput("f",lab+" "+T("fin"))}</div></div></div>
      ${S.prefilled?`<p class="prefill" id="prefill-note">${T("prefilled")}</p>`:lastHours(H)&&!(S.hd.d&&S.hd.f)?`<div><button type="button" class="btn sm" data-act="same-h">${T("same")}</button></div>`:""}
      <div class="notice err" id="h-msg" role="alert" hidden></div>
      <div class="total"><span>${T("presence")}</span><strong id="pres-tot">${fmtH(span(S.hd.d,S.hd.f))}</strong></div>

  const H=S.shalf;
  const done=people.filter(p=>halfState(entries[p.id],H)).length;
  const list=shown.map(p=>{const st=halfState(entries[p.id],H);const pend=entries[p.id]&&entries[p.id].pend&&entries[p.id].pend[H];
    const sum=st&&!st.absent?summary({q:st.q,h:{md:st.d,mf:st.f}},S.lang):"";
    return `<button class="person" data-pick="${p.id}">
      <span class="nm">${esc(fullName(p))}${sum?`<div class="sum">${esc(sum)}</div>`:""}</span>
      ${pend?`<span class="badge warn">${pend===true?T("pending"):T("queueErr")}</span>`:!st?`<span class="badge todo">${T("todo")}</span>`:st.absent?`<span class="badge off">${T("absent")}</span>`:`<span class="badge ok">${T("done")}</span>`}</button>`}).join("");
  const qq=S.queue||[];const qErr=qq.filter(x=>x.err);
  const qBox=qq.length?`<div class="notice warn stack" style="gap:8px"><div class="row between"><b>${T("nPending",qq.length)}</b>${!S.offline?`<button class="btn sm" data-act="flush">${T("sendNow")}</button>`:""}</div>

  return `<div class="stack">

    <div class="row" style="align-items:flex-end">
      <label class="f" style="flex:0 1 200px">${T("date")}<input type="date" id="f-date" class="${isSun(S.date)?"sun":""}" value="${S.date}" max="${today()}" ${minDate?`min="${minDate}"`:""}></label>

      <label class="f" style="flex:1 1 220px">${T("search")}<input type="search" id="f-search" value="${esc(S.search)}" placeholder="${T("searchPh")}"></label>
    </div>
    ${!people.length?`<div class="panel"><h3>${T("noPeople")}</h3><p class="muted">${isResp()?T("noPeopleResp"):T("noPeopleChef")}</p></div>`:
      !S.day?`<p class="muted">${T("loadingDay")}</p>`:
      shown.length?`<div class="people">${list}</div>`:`<p class="muted">${esc(T("noMatch",S.search))}</p>`}
  </div>`;
}

/* --- Supervision et paie --- */
const ZERO=()=>({tache:0,heure:0,total:0,colis:0,unites:0,hh:0,pres:0,smicMin:0,abs:0});
/* cumuls par saisonnier ; half = "tout", "matin" ou "am" */
function aggregate(list,half){
  half=half||"tout";
  const ents=(list||[]).map(e=>{const s=sliceHalf(e,half);s.full=e;s.par=e.par;s.corr=e.corr;return s})
    .filter(e=>presH(e.h)>0||nAbs(e.h)>0||Object.values(e.q).some(v=>v>0));
  const by={};const tot=ZERO();const qtot={};let missing=false;
  for(const e of ents){
    const v=value(e);v.abs=nAbs(e.h);e.v=v;if(v.missing)missing=true;
    const r=by[e.sid]||(by[e.sid]={sid:e.sid,days:new Set(),q:{},...ZERO()});
    if(v.pres>0||Object.values(e.q).some(x=>x>0))r.days.add(e.date);
    for(const k in tot){r[k]+=v[k];tot[k]+=v[k]}
    for(const [k,q] of Object.entries(e.q)){r.q[k]=(r.q[k]||0)+q;qtot[k]=(qtot[k]||0)+q}
  }
  const rows=Object.values(by).sort((a,b)=>personName(a.sid).localeCompare(personName(b.sid),"fr"));
  for(const r of rows)r.alert=r.smicMin>0&&r.heure+0.005<r.smicMin;
  return {ents,rows,tot,qtot,missing,legs:S.legumes.filter(l=>l.actif||qtot[l.id]>0)};
}
function viewSupervision(){
  const per=["jour","semaine","mois"].map(p=>`<button data-period="${p}" aria-pressed="${S.period===p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join("");
  const has=S.range&&S.range.length;
  const head=`<div class="row between"><h2>Tableau de bord</h2>
      <div class="row"><button class="btn primary" data-act="xlsx" ${has?"":"disabled"}>Exporter vers Excel</button><button class="btn" data-act="csv" ${has?"":"disabled"}>CSV</button></div></div>
    <div class="row"><div class="seg" role="group" aria-label="Période">${per}</div>
      <div class="periodnav"><button class="btn sm" data-act="prev" aria-label="Période précédente">‹</button>
      <strong class="${S.period==="jour"&&isSun(S.anchor)?"sun":""}">${S.period==="semaine"?(()=>{const [a,b]=periodRange();return "Semaine du "+esc(fmtDay(a))+` au <span class="sun">${esc(fmtDay(b))}</span>`})():esc(cap(periodLabel()))}</strong>
      <button class="btn sm" data-act="next" aria-label="Période suivante">›</button>
      <button class="btn sm ghost" data-act="now">Aujourd'hui</button></div>
      <div class="seg" role="group" aria-label="Demi-journée">${[["tout","Journée"],["matin","☀ Matin"],["am","◐ Après-midi"]].map(([k,l])=>`<button data-half="${k}" aria-pressed="${S.half===k}">${l}</button>`).join("")}</div></div>`;
  if(!S.range)return `<div class="stack">${head}<p class="muted">Chargement de la période…</p></div>`;
  const A=aggregate(S.range,S.half);
  if(!A.ents.length)return `<div class="stack">${head}<div class="panel"><h3>Aucune saisie sur cette période</h3><p class="muted">Les saisies des chefs d'équipe apparaissent ici en temps réel.</p></div></div>`;
  const notes=[];
  if(HAS_BPC()&&!HAS_TBPC&&S.tarifs.length)notes.push(`<div class="notice warn">Exécutez le fichier supabase/maj-06-securite-et-controles.sql dans Supabase : sans lui, changer le nombre de bottes par colis d'un produit modifierait aussi la paie des mois passés.</div>`);
  if(!HAS_BPC())notes.push(`<div class="notice warn">Montants au colis incomplets : exécutez le fichier supabase/maj-04-bottes-par-colis.sql dans Supabase pour appliquer le nombre de bottes par colis.</div>`);
  if(A.missing)notes.push(`<div class="notice warn">Certains produits saisis n'ont pas de prix sur cette période : les montants sont incomplets. <button class="btn sm ghost" data-view="produits">Compléter les tarifs →</button></div>`);
  if(!S.smic.length)notes.push(`<div class="notice">Renseignez le SMIC horaire dans « Produits et tarifs » pour activer l'alerte SMIC.</div>`);
  const alerts=A.rows.filter(r=>r.alert).length;
  const tiles=`<div class="tile"><div class="v">${fmtH(A.tot.pres)}</div><div class="l">de présence</div></div>
    <div class="tile"><div class="v">${fmtN(A.tot.colis)}</div><div class="l">colis</div></div>
    ${A.tot.unites?`<div class="tile"><div class="v">${fmtN(A.tot.unites)}</div><div class="l">unités</div></div>`:""}
    <div class="tile"><div class="v">${fmtH(A.tot.hh)}</div><div class="l">de travail à l'heure</div></div>
    <div class="tile"><div class="v">${A.rows.length}</div><div class="l">saisonniers</div></div>
    <div class="tile money"><div class="v">${fmtE(A.tot.total)}</div><div class="l">montant total${alerts?` · ${alerts} sous le SMIC`:""}</div></div>`;
  /* saisies : au jour, une ligne par saisonnier avec ses horaires ; à la semaine et au mois, le total de chacun */
  const realise=q=>esc(summary({q,h:null},"fr"))||`<span class="muted">—</span>`;
  const absCell=n=>n?`<span class="badge off">${n} ${n>1?"demi-journées":"demi-journée"}</span>`:`<span class="zero">—</span>`;

      ${showM?`<td>${halfCell(h.md,h.mf,h.xm)}</td>`:""}${showA?`<td>${halfCell(h.ad,h.af,h.xa)}</td>`:""}<td class="n">${e.v.pres?fmtH(e.v.pres):"—"}</td>
      <td class="realise" style="white-space:normal;min-width:200px">${realise(e.q)}</td>
      <td class="n eur">${fmtE(e.v.total)}${e.v.missing?` <span class="badge warn" title="Prix manquant">?</span>`:""}</td>
      <td>${esc(parName(e.par))}${e.corr?` <span class="muted">· corrigé par ${esc(parName(e.corr))}</span>`:""}</td>
      <td><button class="btn sm" data-edit="${e.date}|${e.sid}">Corriger</button></td></tr>`}).join("");
  }else{
    detHead=`<th>Saisonnier</th><th class="n">Jours</th><th class="n">Présence</th><th>Absences</th><th>Réalisé</th><th class="n">Montant</th>`;

      <div>${realise(e.q)}</div>

    :A.rows.map(r=>`<div class="card"><div class="hd"><span>${esc(personName(r.sid))}</span><span class="eur">${fmtE(r.total)}</span></div>
      <div class="meta">${r.days.size} j · ${r.pres?fmtH(r.pres):"—"}${r.abs?" · "+r.abs+" demi-journée"+(r.abs>1?"s":"")+" d'absence":""}</div><div>${realise(r.q)}</div></div>`).join("");
  const detTitle=(S.period==="jour"?"Saisies du jour":S.period==="semaine"?"Saisies de la semaine":"Saisies du mois")+(S.half==="matin"?" · matin":S.half==="am"?" · après-midi":"");
  const paie=A.rows.map(r=>`<tr><td>${esc(personName(r.sid))}</td><td class="n">${r.days.size}</td><td class="n">${fmtH(r.pres)}</td>

    <td>${r.alert?`<span class="badge warn" title="Minimum SMIC : ${fmtE(r.smicMin)} pour ${fmtH(r.hh)} de travail à l'heure, payées ${fmtE(r.heure)}">⚠ sous le SMIC (${fmtE(r.smicMin)})</span>`:""}</td>
    <td><button class="btn ico" data-print="${r.sid}" title="Imprimer la fiche de travail" aria-label="Imprimer la fiche de travail de ${esc(personName(r.sid))}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-4px"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button></td></tr>`).join("");

/* --- Produits et tarifs --- */
function priceCell(l){
  const p=priceAt(l.id,today());const fut=tarifsOf(l.id).find(t=>t.depuis>today());
  const n=bpc(l);
  return (p==null?`<span class="badge warn">Prix à définir</span>`:`<span class="eur">${fmtE(p)}</span> <span class="muted">/ ${priceUnit(l)}</span>`)
    +(l.mode==="colis"?`<div class="muted" style="font-size:.75rem">${n} ${n>1?"bottes":"botte"} par colis${p!=null?" · "+fmtE(p*n)+" le colis":""}</div>`:"")
    +(fut?`<div class="muted" style="font-size:.75rem">${fmtE(fut.prix)} à partir du ${fmtDate(fut.depuis)}</div>`:"");
}
function viewProduits(){

      if(E&&E.kind==="l"&&E.id===l.id){
        const hist=tarifsOf(l.id).map(t=>`${fmtE(t.prix)}${l.mode==="colis"&&t.bpc?" ("+t.bpc+" bottes)":""} ${t.depuis===PRIX_ORIGINE?"(prix de départ)":"depuis le "+fmtDate(t.depuis)}`).join(" · ");

          <label class="f">Nom (français)<input id="el-nom" data-keep value="${F("el-nom")}" required></label>

        <td>${l.actif?`<span class="badge ok">Actif</span>`:`<span class="badge off">Masqué</span>`}</td>
        <td><button class="btn sm" data-edit-l="${l.id}">Modifier</button> <button class="btn sm" data-toggle-l="${l.id}">${l.actif?"Masquer":"Réactiver"}</button></td></tr>`;

  const smHist=S.smic.slice().sort((a,b)=>b.depuis.localeCompare(a.depuis)).map(x=>fmtE(x.taux)+" depuis le "+fmtDate(x.depuis)).join(" · ");

    <p class="muted">Au colis, le prix saisi est celui <b>d'une botte</b> : montant = nombre de colis × bottes par colis × prix de la botte.</p>
    <p class="muted">Les prix ne sont visibles que par les responsables. Le chef d'équipe ne voit que les noms des produits.</p>
    <div class="split wide">
      <section class="panel stack"><h3 style="margin:0">Ajouter un produit ou une tâche</h3>

          <label class="f">Prix (€ / ${(S.form["l-mode"]||"colis")==="colis"?"botte":S.form["l-mode"]==="heure"?"heure":"unité"})<input id="l-prix" data-keep type="number" inputmode="decimal" min="0" step="0.001" value="${F("l-prix")}" placeholder="0,00"></label>
          <button class="btn primary">Ajouter</button>

      </section>
      <section class="panel stack"><h3 style="margin:0">SMIC horaire brut</h3>

        <form id="form-smic" class="addform">

          <label class="f">À partir du<input id="sm-depuis" data-keep type="date" value="${F("sm-depuis")||today().slice(0,8)+"01"}" required></label>
          <button class="btn">Enregistrer</button>
        </form>
        <p class="muted" style="font-size:.8rem">${smHist?"Historique : "+esc(smHist)+". ":""}Sert à l'alerte « sous le SMIC » : le montant du travail à l'heure est comparé aux heures à l'heure × SMIC (les horaires de présence et le travail au colis ou à l'unité ne comptent pas).</p>

    <p class="muted" style="font-size:.85rem">Un produit masqué disparaît de l'écran du chef, mais ses saisies passées restent dans les cumuls et la paie.</p>

}

/* ---------- fenêtre de correction ---------- */
/* ouvre la fenêtre (dialog) et ajoute une étape à l'historique : le bouton « retour » du téléphone la ferme */
function showDlg(d){d.showModal();try{history.pushState({g:"dlg"},"")}catch(e){}}
document.getElementById("dlg").addEventListener("close",()=>{try{if(history.state&&history.state.g==="dlg")history.back()}catch(e){}});
function openEdit(date,sid){
  const e=(S.range||[]).find(x=>x.date===date&&x.sid===sid);if(!e)return;
  const h=e.h||{};
  const legs=S.legumes.filter(l=>l.actif||Number(e.q[l.id])>0);
  const block=(H,lab,ico)=>{const q=H==="matin"?e.qm:e.qa,x=H==="matin"?h.xm:h.xa,d0=H==="matin"?h.md:h.ad,f0=H==="matin"?h.mf:h.af;
    return `<fieldset class="panel stack" data-half-block="${H}" style="margin:0;padding:12px"><legend style="font-weight:700;padding:0 6px">${ico} ${lab}</legend>
      <label class="chk"><input type="checkbox" data-ex="${H}" ${x?"checked":""}> Absent(e) ${H==="matin"?"le matin":"l'après-midi"}</label>
      <div class="tm row" style="flex-wrap:nowrap"><input type="time" step="300" data-eh="${H}|d" value="${esc(d0||"")}" aria-label="${lab} début"><span>–</span><input type="time" step="300" data-eh="${H}|f" value="${esc(f0||"")}" aria-label="${lab} fin"></div>
      ${MODES.map(m=>{const ls=legs.filter(l=>l.mode===m);if(!ls.length)return "";
        return `<div class="sec"><h4>${MODE_LABEL[m]}</h4><span class="ln"></span></div>`+ls.map(l=>`<div class="qrow" style="padding:6px 10px"><div><div class="lg">${esc(l.nom)}</div><div class="un">${m==="heure"?"heures":esc(MODE_UNIT[m])}</div></div><input data-eq="${H}|${l.id}" type="text" inputmode="decimal" autocomplete="off" value="${fmtIn(Number(q[l.id])||"")}" placeholder="0" style="width:100px;text-align:right" aria-label="${esc(l.nom)} ${lab}"></div>`).join("")}).join("")}
    </fieldset>`};
  const d=document.getElementById("dlg");
  d.innerHTML=`<div class="dh"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><h3>Corriger la saisie</h3><button type="button" class="btn-out" id="e-x" aria-label="Fermer">✕</button></div><div style="font-size:.85rem;opacity:.9">${esc(personName(sid))} · ${esc(fmtLong(date))}${isSun(date)?" "+sunBadge("fr"):""}</div></div>
   <form class="db" id="form-edit">
    <div class="row" style="justify-content:flex-end;gap:8px"><button type="button" class="btn" id="e-cancel2">Annuler</button><button class="btn validate">Enregistrer</button></div>
    ${block("matin","Matin","☀")}
    ${block("am","Après-midi","◐")}
    <div class="row between">
      <button type="button" class="btn danger" id="e-del">Effacer la journée</button>
      <div class="row"><button type="button" class="btn" id="e-cancel">Annuler</button><button class="btn validate">Enregistrer</button></div>
    </div>
    <section id="e-journal" hidden><h3 style="margin:0">Historique des modifications</h3><div class="journal" id="e-jl"></div></section></form>`;
  showDlg(d);
  loadJournal(date,sid);
  for(const id of ["#e-cancel","#e-cancel2","#e-x"])d.querySelector(id).onclick=()=>d.close();
  const busy=on=>d.querySelectorAll("button").forEach(b=>b.disabled=on);
  const del=d.querySelector("#e-del");
  del.onclick=async()=>{
    if(!del.dataset.confirm){del.dataset.confirm="1";del.textContent="Confirmer : tout effacer";return}
    busy(true);
    /* une seule opération (maj-06) ; avant maj-06, deux suppressions */
    let {error}=await sb.rpc("effacer_journee",{p_date:date,p_saisonnier:Number(sid)});
    if(error&&isMissingFn(error,"effacer_journee")){
      const [a,b]=await Promise.all([sb.from("recoltes").delete().eq("date",date).eq("saisonnier_id",Number(sid)),sb.from("presences").delete().eq("date",date).eq("saisonnier_id",Number(sid))]);
      error=a.error||b.error;
    }
    if(error){busy(false);return toast(errMsg(error,"fr"),true)}
    d.close();toast("Journée effacée");reloadData();
  };
  d.querySelector("#form-edit").onsubmit=async ev=>{
    ev.preventDefault();
    const data={matin:{q:{},hd:{d:"",f:""},absent:false},am:{q:{},hd:{d:"",f:""},absent:false}};
    let bad=null;
    d.querySelectorAll("[data-eq]").forEach(i=>{const [H,k]=i.dataset.eq.split("|");const n=num(i.value);i.classList.toggle("err",!(n>=0));if(!(n>=0)&&!bad)bad={i,n};data[H].q[k]=n>=0?n:0});
    if(bad){bad.i.focus();return toast(isNaN(bad.n)?I18N.fr.errNum:I18N.fr.errNeg,true)}
    d.querySelectorAll("[data-eh]").forEach(i=>{const [H,k]=i.dataset.eh.split("|");data[H].hd[k]=i.value});
    d.querySelectorAll("[data-ex]").forEach(i=>{data[i.dataset.ex].absent=i.checked});
    for(const H of ["matin","am"]){const chk=checkHalf(data[H].hd,data[H].q,data[H].absent,"fr",false);if(chk)return toast((H==="matin"?"Matin : ":"Après-midi : ")+chk,true)}
    const arg=H=>{const x=data[H];return {debut:x.absent?null:(x.hd.d||null),fin:x.absent?null:(x.hd.f||null),absent:x.absent,quantites:x.q}};
    busy(true);
    /* matin et après-midi enregistrés ensemble (maj-06) : tout ou rien */
    let {error}=await sb.rpc("corriger_journee",{p_date:date,p_saisonnier:Number(sid),p_matin:arg("matin"),p_am:arg("am")});
    if(error&&isMissingFn(error,"corriger_journee")){
      error=null;
      for(const H of ["matin","am"]){const x=arg(H);
        const r=await sb.rpc("enregistrer_demi_journee",{p_date:date,p_saisonnier:Number(sid),p_periode:H,p_debut:x.debut,p_fin:x.fin,p_absent:x.absent,p_quantites:x.quantites});
        if(r.error){error=r.error;break}}
    }
    if(error){busy(false);return toast(errMsg(error,"fr"),true)}
    d.close();toast("Saisie corrigée");reloadData();
  };
}
/* journal des modifications (maj-07) : qui a saisi ou corrigé quoi, et quand */
async function loadJournal(date,sid){
  const box=document.getElementById("e-journal");if(!box)return;
  const {data,error}=await sb.from("journal_saisies").select("*").eq("date",date).eq("saisonnier_id",Number(sid)).order("quand",{ascending:false}).range(0,59);
  if(error||!data||!data.length)return; /* pas encore de journal (maj-07 non exécutée) ou rien à montrer */
  const when=q=>new Intl.DateTimeFormat("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(q));
  const hrs=(x,a,b,ab)=>x?(x[ab]?"absent":(x[a]?fmtT(x[a])+"–"+fmtT(x[b]):"—")):"—";
  const line=j=>{const av=j.avant,ap=j.apres;
    if(j.table_nom==="recoltes"){const l=legById(j.legume_id);const nm=l?l.nom:"Produit retiré";const per=j.periode==="am"?"après-midi":"matin";
      const u=x=>x?fmtN(Number(x.quantite)):"0";
      return `${nm} (${per}) : ${j.action==="INSERT"?"ajouté "+u(ap):j.action==="DELETE"?"retiré ("+u(av)+")":u(av)+" → "+u(ap)}`}
    const parts=[];
    if(hrs(av,"matin_debut","matin_fin","matin_absent")!==hrs(ap,"matin_debut","matin_fin","matin_absent"))parts.push("matin "+hrs(av,"matin_debut","matin_fin","matin_absent")+" → "+hrs(ap,"matin_debut","matin_fin","matin_absent"));
    if(hrs(av,"am_debut","am_fin","am_absent")!==hrs(ap,"am_debut","am_fin","am_absent"))parts.push("après-midi "+hrs(av,"am_debut","am_fin","am_absent")+" → "+hrs(ap,"am_debut","am_fin","am_absent"));
    return "Horaires : "+(parts.join(" · ")||"inchangés")};
  const rows=data.map(j=>({j,t:line(j)})).filter(x=>!/inchangés$/.test(x.t));if(!rows.length)return;
  document.getElementById("e-jl").innerHTML=rows.map(({j,t})=>`<div><span class="muted">${esc(when(j.quand))} · ${esc(parName(j.par))}</span><br>${esc(t)}</div>`).join("");
  box.hidden=false;
}

/* contrôle des horaires (renvoie un message d'erreur ou rien) */
/* contrôle d'une demi-journée. Les horaires sont obligatoires, sauf absence.
   required = true pour la saisie du chef ; à la correction, seulement si des quantités sont saisies. */
function checkHalf(hd,q,absent,lang,required){
  if(absent)return "";
  const t=k=>I18N[lang][k];
  const hasQ=Object.values(q).some(v=>v>0);
  if((required||hasQ)&&(!hd.d||!hd.f))return t("errHours");
  if(!!hd.d!==!!hd.f)return t("errPair");
  if(hd.d&&tmin(hd.f)<=tmin(hd.d))return t("errOrder");
  let hh=0;for(const [k,v] of Object.entries(q)){const l=legById(k);if(l&&l.mode==="heure")hh+=v}
  const pres=span(hd.d,hd.f);
  if(pres&&hh>pres+1e-9)return t("errOver");
  return "";
}

/* ---------- export ---------- */
function exportRows(){
  const A=aggregate(S.range);const [a,b]=periodRange();
  const who=sid=>S.saisonniers.find(x=>x.id===sid)||{nom:"Saisonnier retiré",prenom:""};
  const paie=[["Prénom","Nom","Jours travaillés","Heures de présence","Demi-journées d'absence","Colis","Unités","Heures à l'heure","Montant à la tâche (€)","Montant à l'heure (€)","Total (€)","Minimum SMIC sur heures à l'heure (€)","Alerte"]];
  for(const r of A.rows){const p=who(r.sid);paie.push([p.prenom,p.nom.toUpperCase(),r.days.size,r2(r.pres),r.abs,r.colis,r.unites,r2(r.hh),r2(r.tache),r2(r.heure),r2(r.total),r2(r.smicMin),r.alert?"Sous le SMIC":""])}
  paie.push(["TOTAL","","",r2(A.tot.pres),A.tot.abs,A.tot.colis,A.tot.unites,r2(A.tot.hh),r2(A.tot.tache),r2(A.tot.heure),r2(A.tot.total),r2(A.tot.smicMin),""]);
  const detail=[["Date","Jour","Prénom","Nom","Demi-journée","Début","Fin","Absent","Présence (h)","Produit","Mode de paie","Quantité","Bottes par colis","Prix (€ / botte, unité ou h)","Montant (€)","Saisi par","Corrigé par"]];
  for(const e of A.ents){const p=who(e.sid);const f=e.full,h=f.h||{};
    for(const H of ["matin","am"]){
      const q=H==="matin"?f.qm:f.qa,d0=H==="matin"?h.md:h.ad,f0=H==="matin"?h.mf:h.af,x=H==="matin"?h.xm:h.xa;
      const ls=S.legumes.filter(l=>Number(q[l.id])>0);
      if(!x&&!d0&&!ls.length)continue;
      const base=[e.date,new Intl.DateTimeFormat("fr-FR",{weekday:"long"}).format(parse(e.date)),p.prenom,p.nom.toUpperCase(),H==="matin"?"Matin":"Après-midi",d0||"",f0||"",x?"Oui":"",r2(span(d0,f0))];
      const end=[parName(e.par),e.corr?parName(e.corr):""];
      if(!ls.length)detail.push([...base,"","","","","","",...end]);
      ls.forEach(l=>{const n=Number(q[l.id]);const pr=priceAt(l.id,e.date);
        detail.push([...base,l.nom,MODE_LABEL[l.mode],n,l.mode==="colis"?bpcAt(l,e.date):"",pr==null?"":pr,pr==null?"":lineAmount(l,n,e.date),...end])});
    }
  }
  const tarifs=[["Produit","Portugais","Mode de paie","Prix (€ / botte, unité ou h)","Bottes par colis","Prix du colis (€)","À partir du"]];
  for(const l of S.legumes)for(const t of tarifsOf(l.id).slice().reverse()){const n=l.mode==="colis"?(t.bpc||bpcAt(l,t.depuis)):"";
    tarifs.push([l.nom,l.nom_pt||"",MODE_LABEL[l.mode],t.prix,n,l.mode==="colis"?r2(t.prix*n):"",t.depuis===PRIX_ORIGINE?"":t.depuis])}
  tarifs.push([]);tarifs.push(["SMIC horaire brut","","","Taux (€ / h)","","","À partir du"]);
  for(const s of S.smic.slice().sort((x,y)=>x.depuis.localeCompare(y.depuis)))tarifs.push(["SMIC","","",s.taux,"","",s.depuis]);
  return {paie,detail,tarifs,tag:S.period==="mois"?a.slice(0,7):a+"_"+b,a,b};
}

  const TOT={font:{bold:true},fill:{fgColor:{rgb:"E9E5D8"}}};
  const styleRow=(ws,r,ncol,st)=>{for(let c=0;c<ncol;c++){const a=XLSX.utils.encode_cell({r,c});if(!ws[a])ws[a]={t:"s",v:""};ws[a].s=st}};

  XLSX.utils.book_append_sheet(wb,ws1,"Paie");
  /* Détail : colonne A en vraie date ; ligne entière en orange le dimanche */
  const det=R.detail.map((r,i)=>i?[parse(r[0]),...r.slice(1)]:r);
  const ws2=XLSX.utils.aoa_to_sheet(det,{cellDates:true,dateNF:"dd/mm/yyyy"});
  ws2["!cols"]=[{wch:12},{wch:10},{wch:14},{wch:18},{wch:13},{wch:8},{wch:8},{wch:8},{wch:11},{wch:18},{wch:12},{wch:10},{wch:10},{wch:14},{wch:12},{wch:18},{wch:18}];

  ws2["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:det.length-1,c:det[0].length-1}})};
  XLSX.utils.book_append_sheet(wb,ws2,"Détail");

  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array",cellStyles:true});
  saveBlob("Recoltes_SCEA-Guidal_"+R.tag+".xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}
