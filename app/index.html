  const nom=(S.form["u-nom"]||"").trim(),ident=(S.form["u-ident"]||"").trim().toLowerCase(),mdp=S.form["u-mdp"]||"",role=S.form["u-role"]||"chef";
  if(!nom||!ident||!mdp)return toast("Remplissez le nom, l'identifiant et le mot de passe.",true);
  if(!/^[a-z0-9._-]{2,40}$/.test(ident))return toast("Identifiant invalide : lettres minuscules sans accent, chiffres, point ou tiret.",true);
  if(mdp.length<6)return toast("Le mot de passe doit faire au moins 6 caractères.",true);
  if(S.profils.some(p=>p.identifiant===ident))return toast("Cet identifiant existe déjà.",true);
  S.form._busy=true;render();
  try{
    if(DEMO){const r=await sb.from("profils").insert({identifiant:ident,nom,role});if(r.error)throw r.error}
    else{
      let r=await sb.from("invitations").upsert({identifiant:ident,nom,role,created_at:new Date().toISOString()});
      if(r.error)throw r.error;
      const tmp=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"guidal-creation"}});
      r=await tmp.auth.signUp({email:ident+"@"+DOMAIN,password:mdp});
      if(r.error){await sb.from("invitations").delete().eq("identifiant",ident);throw r.error}
    }
    await loadProfils();
    if(S.profils.some(p=>p.identifiant===ident)){S.form["u-nom"]=S.form["u-ident"]=S.form["u-mdp"]="";toast("Compte créé : "+ident)}
    else toast("Compte enregistré mais pas encore actif. Vérifiez le réglage « Confirm email » dans Supabase (voir le guide).",true);
  }catch(e){toast(/already registered/i.test(e.message||"")?"Cet identifiant existe déjà.":/Database error saving new user|Invitation/i.test(e.message||"")?"La base a refusé la création du compte (invitation absente ou expirée). Réessayez.":errMsg(e),true)}
  S.form._busy=false;render();
}
async function moveLegume(id,dir){
  const l=legById(id);if(!l)return;
  const grp=S.legumes.filter(x=>x.mode===l.mode);const i=grp.indexOf(l),j=i+dir;if(j<0||j>=grp.length)return;
  [grp[i],grp[j]]=[grp[j],grp[i]];
  const ups=[];grp.forEach((x,k)=>{const o=MODES.indexOf(l.mode)*100+k+1;if(x.ordre!==o){x.ordre=o;ups.push(sb.from("legumes").update({ordre:o}).eq("id",Number(x.id)))}});
  S.legumes.sort((a,b)=>MODES.indexOf(a.mode)-MODES.indexOf(b.mode)||(a.ordre-b.ordre)||(a.id-b.id));render();
  const res=await Promise.all(ups);const er=res.find(r=>r.error);if(er)toast(errMsg(er.error),true);
  await loadRef();render();
}
function setPrice(lid,prix,depuis,nbBottes){
  if(!tarifsOf(lid).length)depuis=PRIX_ORIGINE;
  const row={legume_id:Number(lid),prix,depuis};
  if(HAS_TBPC){const l=legById(lid);row.bottes_par_colis=nbBottes||(l&&l.mode==="colis"?bpcAt(l,depuis):1)}
  return sb.from("tarifs").upsert(row,{onConflict:"legume_id,depuis"});
}

document.addEventListener("click",async e=>{
  const row=e.target.closest("tr[data-sel-s]");
  if(row&&!e.target.closest("button")){const p=S.saisonniers.find(x=>x.id===row.dataset.selS);S.selS=p.id;S.form["es-nom"]=p.nom;S.form["es-prenom"]=p.prenom;render();return}
  const t=e.target.closest("button");if(!t||t.closest("dialog"))return;
  if(t.dataset.view){S.view=t.dataset.view;S.editCfg=null;store("guidal.view",S.view);if(S.view==="saisonniers")loadMois();render();window.scrollTo(0,0);return}
  if(t.dataset.lang){S.lang=t.dataset.lang;store("guidal.lang",S.lang);document.documentElement.lang=S.lang;document.getElementById("toast").hidden=true;render();return}
  if(t.dataset.demo){login(t.dataset.demo,"demo");return}
  if(t.dataset.pick){S.selected=t.dataset.pick;loadDraft();render();window.scrollTo(0,0);try{history.pushState({g:"fiche"},"")}catch(e){}return}
  if(t.dataset.shalf){if(t.dataset.shalf===S.shalf)return;
    /* changer de demi-journée sans valider : on demande une seconde touche pour ne pas perdre la saisie */
    if(S.selected&&isDirty()&&S.halfOk!==t.dataset.shalf){S.halfOk=t.dataset.shalf;return toast(T("switchHalf",T("halfOf",S.shalf)),true)}
    S.halfOk="";S.shalf=t.dataset.shalf;S.shalfAuto=false;if(S.selected)loadDraft();render();return}
  if(t.dataset.half){S.half=t.dataset.half;render();return}
  if(t.dataset.qdel){queueSave(queueAll().filter(x=>x.key!==t.dataset.qdel));S.day=null;loadDay();return}
  if(t.dataset.step){const id=t.dataset.leg;const cur=num(S.draft[id]);const v=Math.max(0,Math.round(((cur>0?cur:0)+Number(t.dataset.step))*100)/100);S.draft[id]=v||"";S.bigOk="";const inp=document.getElementById("q-"+id);if(inp)inp.value=fmtIn(S.draft[id]);updMeter();return}
  if(t.dataset.period){S.period=t.dataset.period;loadRange();return}
  if(t.dataset.sfilter){S.sFilter=t.dataset.sfilter;render();return}
  if(t.dataset.edit){const [d,s]=t.dataset.edit.split("|");openEdit(d,s);return}
  if(t.dataset.print){printFiche(t.dataset.print);return}
  if(t.dataset.delS){openDelS(t.dataset.delS);return}
  if(t.dataset.move){const [id,dir]=t.dataset.move.split("|");moveLegume(id,Number(dir));return}
  if(t.dataset.toggleS){const p=S.saisonniers.find(x=>x.id===t.dataset.toggleS);if(await run(sb.from("saisonniers").update({actif:!p.actif}).eq("id",Number(p.id)),p.actif?"Marqué parti":"Réactivé")){await loadRef();render()}return}
  if(t.dataset.toggleL){const l=S.legumes.find(x=>x.id===t.dataset.toggleL);if(await run(sb.from("legumes").update({actif:!l.actif}).eq("id",Number(l.id)))){await loadRef();render()}return}
  if(t.dataset.editL){const l=S.legumes.find(x=>x.id===t.dataset.editL);S.editCfg={kind:"l",id:l.id};S.form["el-nom"]=l.nom;S.form["el-nompt"]=l.nom_pt||"";S.form["el-mode"]=l.mode;S.form["el-bpc"]=bpcAt(l,today());S.form["el-prix"]="";S.form["el-depuis"]=today();render();return}
  if(t.dataset.editU){const p=S.profils.find(x=>x.id===t.dataset.editU);S.editCfg={kind:"u",id:p.id};S.form["eu-nom"]=p.nom;S.form["eu-ident"]=p.identifiant;S.form["eu-role"]=p.role;render();return}
  if(t.dataset.pw){S.editCfg={kind:"pw",id:t.dataset.pw};S.form["pw-new"]="";render();return}
  if(t.dataset.toggleU){const p=S.profils.find(x=>x.id===t.dataset.toggleU);if(await run(sb.from("profils").update({actif:!p.actif}).eq("id",p.id),p.actif?"Compte désactivé":"Compte réactivé")){await loadProfils();render()}return}
  switch(t.dataset.act){
    case "logout":try{if(navigator.credentials&&navigator.credentials.preventSilentAccess)await navigator.credentials.preventSilentAccess()}catch(e){}await sb.auth.signOut();break;
    case "demo-reset":sb.reset();break;
    case "share":openShare();break;
    case "cfg-cancel":S.editCfg=null;render();break;
    case "back":closeFiche();break;
    case "flush":flushQueue();break;
    case "retry":S.netErr=false;S.booting=true;render();{const ss=S.session;S.session=null;onSession(ss)}break;
    case "same-h":{const x=lastHours(S.shalf);if(!x)break;S.hd=x;S.prefilled=true;render();break}
    case "absent":S.absent=!S.absent;saveBrouillon();render();break;
    case "clear":{
      if(!t.dataset.confirm){t.dataset.confirm="1";t.textContent=T("clearConfirm");return}
      const st=halfState((S.day||{})[S.selected],S.shalf);const q={};
      for(const l of S.legumes)q[l.id]=0;if(st)for(const k in st.q)q[k]=0;
      t.disabled=true;
      const args={p_date:S.date,p_saisonnier:Number(S.selected),p_periode:S.shalf,p_debut:null,p_fin:null,p_absent:false,p_quantites:q};
      const {error}=await sb.rpc("enregistrer_demi_journee",args);
      if(error&&isNetErr(error)){enqueue(args);S.offline=true;S.day=overlayQueue(S.day||{})}
      else if(error){toast(errMsg(error),true);t.disabled=false;return}
      const n=personName(S.selected);closeFiche();toast(T("cleared")+" · "+n);reloadData();window.scrollTo(0,0);break}
    case "validate":{
      if(S.sending)return;
      const H=S.shalf,hd=S.hd;
      /* date : jamais dans le futur ; chef : seulement la période autorisée */
      if(S.date>today())return toast(T("errFuture"),true);
      if(!isResp()&&S.date<addDays(today(),-CHEF_JOURS))return toast(T("errWindow",CHEF_JOURS),true);
      /* quantités : nombres positifs uniquement */
      const q={};let bad=null;
      for(const l of activeLegumes()){const n=num(S.draft[l.id]);if(!(n>=0)){bad=bad||{l,n}}q[l.id]=n>=0?n:0}
      if(bad){updMeter();const i=document.getElementById("q-"+bad.l.id);if(i){i.scrollIntoView({block:"center"});i.focus()}return toast(isNaN(bad.n)?T("errNum"):T("errNeg"),true)}
      const chk=checkHalf(hd,S.absent?{}:q,S.absent,S.lang,true);
      if(chk){
        if(chk===T("errHours")){let first=null;for(const k of ["d","f"]){const i=document.getElementById("h-"+k);if(i&&!i.value){i.classList.add("err");first=first||i}}
          const m=document.getElementById("h-msg");if(m){m.textContent=chk;m.hidden=false}
          if(first){first.scrollIntoView({block:"center"});first.focus()}
          return} /* message déjà affiché dans la page : pas de doublon */
        return toast(chk,true)}
      /* quantités inhabituelles : seconde touche pour confirmer */
      if(!S.absent){const big=activeLegumes().find(l=>{const n=q[l.id];return n>0&&((l.mode==="colis"&&(n>100||n%1))||(l.mode==="unite"&&n>3000))});
        if(big){const key=big.id+":"+q[big.id];if(S.bigOk!==key){S.bigOk=key;const n=q[big.id];return toast(T("bigQ",fmtN(n),unitShort(big.mode,n,S.lang),lname(big)),true)}}}
      S.sending=true;render();
      const args={p_date:S.date,p_saisonnier:Number(S.selected),p_periode:H,p_debut:S.absent?null:(hd.d||null),p_fin:S.absent?null:(hd.f||null),p_absent:S.absent,p_quantites:S.absent?{}:q};
      const {error}=await sb.rpc("enregistrer_demi_journee",args);
      S.sending=false;
      const queued=error&&isNetErr(error);
      if(error&&!queued){render();return toast(errMsg(error),true)}
      if(queued){enqueue(args);S.offline=true;S.day=overlayQueue(S.day||{})}
      if(!S.absent&&span(hd.d,hd.f))rememberHours(H,hd);
      const n=personName(S.selected);S.search="";closeFiche();
      toast(queued?T("queued")+" · "+n:T("saved")+" · "+n);if(!queued)reloadData();window.scrollTo(0,0);break}
    case "prev":shiftPeriod(-1);break;
    case "next":shiftPeriod(1);break;
    case "now":S.anchor=today();loadRange();break;
    case "xlsx":doXlsx();break;
    case "csv":doCsv();break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="f-search"){S.search=t.value;render()}
  else if(t.id==="f-ssearch"){S.sSearch=t.value;render()}
  else if(t.dataset&&t.dataset.q){S.draft[t.dataset.q]=t.value;S.bigOk="";updMeter();saveBrouillon()}
  else if(t.dataset&&t.dataset.h){S.hd[t.dataset.h]=t.value;S.prefilled=false;saveBrouillon();const pn=document.getElementById("prefill-note");if(pn)pn.hidden=true;if(t.value){t.classList.remove("err");const m=document.getElementById("h-msg");if(m&&S.hd.d&&S.hd.f)m.hidden=true}updMeter()}
  else if(t.dataset&&"keep" in t.dataset){S.form[t.id]=t.value}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="f-date"&&t.value){
    /* la date tapée au clavier n'est pas bloquée par le calendrier : on vérifie ici */
    if(t.value>today()){toast(T("errFuture"),true);t.value=S.date;return}
    if(!isResp()&&t.value<addDays(today(),-CHEF_JOURS)){toast(T("errWindow",CHEF_JOURS),true);t.value=S.date;return}
    S.date=t.value;S.dateAuto=S.date===today();S.selected=null;S.day=null;loadDay()}
  else if(t.dataset&&t.dataset.h){S.hd[t.dataset.h]=t.value;if(t.value){t.classList.remove("err");const m=document.getElementById("h-msg");if(m&&S.hd.d&&S.hd.f)m.hidden=true}updMeter()}
  else if(t.dataset&&"keep" in t.dataset){S.form[t.id]=t.value;if(t.id==="l-mode"||t.id==="el-mode")render()}
});
document.addEventListener("submit",async e=>{
  const f=e.target;if(f.closest("dialog"))return;
  e.preventDefault();
  const v=id=>(document.getElementById(id)||{}).value||"";
  switch(f.id){
    case "form-login":login(v("l-ident"),v("l-mdp"));break;
    case "form-s":{const nom=v("s-nom").trim(),prenom=v("s-prenom").trim();if(!nom||!prenom)return;
      if(await run(sb.from("saisonniers").insert({nom,prenom}),prenom+" "+nom+" ajouté(e)")){S.form["s-nom"]=S.form["s-prenom"]="";await loadRef();render()}break}
    case "form-l":{const nom=v("l-nom").trim(),nom_pt=v("l-nompt").trim()||null,mode=v("l-mode")||"colis",prixTxt=v("l-prix");if(!nom)return;
      const ordre=MODES.indexOf(mode)*100+S.legumes.filter(l=>l.mode===mode).length+1;
      const row={nom,nom_pt,mode,ordre};if(HAS_BPC())row.bottes_par_colis=mode==="colis"?Math.max(1,Math.round(num(v("l-bpc"))||1)):1;
      if(!await run(sb.from("legumes").insert(row)))break;
      await loadRef();
      if(prixTxt!==""&&num(prixTxt)>=0){const l=S.legumes.filter(x=>x.nom===nom&&x.mode===mode).sort((a,b)=>b.id-a.id)[0];if(l)await run(setPrice(l.id,num(prixTxt),PRIX_ORIGINE,row.bottes_par_colis))}
      toast(nom+" ajouté");S.form["l-nom"]=S.form["l-nompt"]=S.form["l-prix"]=S.form["l-bpc"]="";await loadRef();render();break}
    case "form-es":{const nom=v("es-nom").trim(),prenom=v("es-prenom").trim();if(!nom||!prenom)return;
      if(await run(sb.from("saisonniers").update({nom,prenom}).eq("id",Number(f.dataset.id)),"Saisonnier modifié")){await loadRef();render()}break}
    case "form-el":{const id=f.dataset.id,nom=v("el-nom").trim(),nom_pt=v("el-nompt").trim()||null,mode=v("el-mode"),prixTxt=v("el-prix"),depuis=v("el-depuis")||today();if(!nom)return;
      const l=legById(id);if(!l)return;
      /* changer le mode de paie changerait la paie de toutes les saisies passées : interdit dès qu'il y en a */
      if(l.mode!==mode){const c=await sb.from("recoltes").select("id").eq("legume_id",Number(id)).range(0,0);
        if(c.error)return toast(errMsg(c.error),true);
        if(c.data&&c.data.length)return toast("Ce produit a déjà des saisies : son mode de paie ne peut plus changer (sinon la paie passée serait recalculée). Masquez-le et créez un nouveau produit avec le bon mode.",true)}
      const oldBpc=Number(l.bottes_par_colis)||1;
      const newBpc=mode==="colis"&&HAS_BPC()?Math.max(1,Math.round(num(v("el-bpc"))||oldBpc)):1;
      const bpcChange=mode==="colis"&&HAS_BPC()&&newBpc!==bpcAt(l,depuis);
      const upd={nom,nom_pt,mode};if(l.mode!==mode)upd.ordre=MODES.indexOf(mode)*100+S.legumes.filter(x=>x.mode===mode).length+1;
      /* avec maj-06, le nombre de bottes est daté dans les tarifs ; la fiche produit garde la valeur actuelle */
      if(HAS_BPC()&&(!HAS_TBPC||depuis<=today()||l.mode!==mode))upd.bottes_par_colis=newBpc;
      if(!await run(sb.from("legumes").update(upd).eq("id",Number(id))))break;
      if(prixTxt!==""&&!(num(prixTxt)>=0))return toast("Prix illisible : tapez un nombre (ex. 0,28).",true);
      if(prixTxt!==""||(bpcChange&&HAS_TBPC)){
        const prix=prixTxt!==""?num(prixTxt):priceAt(id,depuis);
        if(prix==null)return toast("Indiquez d'abord un prix pour ce produit.",true);
        if(!await run(setPrice(id,prix,depuis,mode==="colis"?newBpc:null)))break}
      toast(prixTxt!==""||bpcChange?"Produit et tarif enregistrés":"Produit modifié");S.editCfg=null;await loadRef();render();break}
    case "form-smic":{const taux=Number(v("sm-taux")),depuis=v("sm-depuis");if(!(taux>0)||!depuis)return toast("Indiquez un taux et une date.",true);
      if(await run(sb.from("smic").upsert({depuis,taux},{onConflict:"depuis"}),"SMIC enregistré")){S.form["sm-taux"]="";await loadRef();render()}break}
    case "form-u":createAccount();break;
    case "form-eu":{
      const id=f.dataset.id,p=S.profils.find(x=>x.id===id),nom=v("eu-nom").trim(),ident=v("eu-ident").trim().toLowerCase();
      if(!p||!nom||!ident)return toast("Remplissez le nom et l'identifiant.",true);
      const identChange=ident!==p.identifiant;
      if(identChange){
        if(!/^[a-z0-9._-]{2,40}$/.test(ident))return toast("Identifiant invalide : lettres minuscules sans accent, chiffres, point ou tiret.",true);
        const {error}=await sb.rpc("changer_identifiant",{p_user:id,p_ident:ident});
        if(error)return toast(errMsg(error),true);
      }
      const upd={nom};const r=document.getElementById("eu-role");if(r)upd.role=r.value;
      const {data,error}=await sb.from("profils").update(upd).eq("id",id).select("id");
      if(error)return toast(errMsg(error),true);
      if(!data||!data.length)return toast("La base a refusé la modification. Reconnectez-vous avec un compte responsable.",true);
      toast(identChange&&id===S.profil.id?"Compte modifié. Votre identifiant de connexion est maintenant : "+ident:"Compte modifié");
      S.editCfg=null;await loadProfils();
      if(id===S.profil.id){S.profil.nom=nom;S.profil.identifiant=ident}
      render();break}
    case "form-pw":{const mdp=v("pw-new");if(mdp.length<6)return toast("Le mot de passe doit faire au moins 6 caractères.",true);
      if(await run(sb.rpc("changer_mot_de_passe",{p_user:f.dataset.id,p_mdp:mdp}),"Mot de passe changé")){S.editCfg=null;S.form["pw-new"]="";render()}break}
  }
});

/* ---------- démarrage ---------- */
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
document.documentElement.lang=S.lang;
render();
if(sb){
  sb.auth.getSession().then(({data})=>onSession(data.session));
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="INITIAL_SESSION")return;setTimeout(()=>onSession(session),0)});
}else{S.booting=false;render()}
})();
</script>
